<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>SÄKER ANSLUTNING | Allabostäder Intelligence</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@200;400;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --black: #020203;
            --gold: #D4AF37;
            --blue: #007AFF;
            --surface: #0a0a0f;
            --border: rgba(212, 175, 55, 0.15);
        }
        * { box-sizing: border-box; -webkit-font-smoothing: antialiased; margin: 0; padding: 0; }
        body { 
            background: var(--black); 
            color: #fff; 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }

        #loader {
            display: none;
            position: fixed;
            inset: 0;
            background: var(--black);
            z-index: 9999;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .container { max-width: 500px; width: 100%; padding: 20px; }
        
        .card { 
            background: var(--surface); 
            border: 1px solid var(--border); 
            padding: 50px 30px; 
            text-align: center;
            position: relative;
        }

        .session-info { font-family: monospace; color: var(--gold); font-size: 10px; letter-spacing: 2px; margin-bottom: 30px; opacity: 0.5; }

        h1 { font-size: 2rem; font-weight: 800; letter-spacing: -1px; margin-bottom: 10px; color: #fff; }
        .location-text { color: var(--blue); font-weight: 800; text-transform: uppercase; font-size: 12px; letter-spacing: 2px; margin-bottom: 30px; display: block; }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        input[type="email"] {
            background: rgba(255,255,255,0.03);
            border: 1px solid #222;
            padding: 20px;
            color: #fff;
            font-family: inherit;
            text-align: center;
            outline: none;
            font-size: 16px;
            border-radius: 2px;
        }

        .unlock-btn {
            background: #fff;
            color: #000;
            padding: 20px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 2px;
            cursor: pointer;
            border: none;
            font-size: 11px;
            transition: 0.2s;
        }
        .unlock-btn:hover { background: var(--gold); transform: translateY(-2px); }

        .spin {
            width: 40px; height: 40px; border: 3px solid var(--gold); border-top-color: transparent; border-radius: 50%;
            animation: rotate 0.8s linear infinite; margin-bottom: 20px;
        }
        @keyframes rotate { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        
        footer { margin-top: 30px; font-size: 9px; color: #333; letter-spacing: 1px; text-transform: uppercase; }
    </style>
</head>
<body>

<div id="loader">
    <div class="spin"></div>
    <div id="loader-text" style="font-size: 10px; letter-spacing: 3px; color: var(--gold);">ANSLUTER TILL VALVET...</div>
</div>

<div class="container">
    <div class="card">
        <div class="session-info" id="session-id">STATUS: KRYPTERAD_ANSLUTNING</div>
        <h1>ÖPPNA VALVET</h1>
        <span class="location-text" id="ort-namn">REGION: SVERIGE</span>

        <div class="input-group">
            <input type="email" id="user-email" placeholder="Ange din e-postadress" required>
            <button onclick="accessVault()" class="unlock-btn">HÄMTA TILLGÅNG</button>
        </div>
        
        <footer>&copy; ALLABOSTÄDER INTEL DIVISION</footer>
    </div>
</div>

<script>
    const params = new URLSearchParams(window.location.search);
    const ort = params.get('name') || 'Sverige';
    document.getElementById('ort-namn').innerText = "REGION: " + ort.toUpperCase();
    document.getElementById('session-id').innerText = "GATE_ID: " + Math.random().toString(36).substring(7).toUpperCase();

    function accessVault() {
        const email = document.getElementById('user-email').value;
        if (!email.includes('@')) { 
            alert("Verifiering misslyckades. Ange en giltig e-postadress."); 
            return; 
        }
        
        document.getElementById('loader').style.display = 'flex';
        
        setTimeout(() => {
            document.getElementById('loader-text').innerText = "IDENTITET VERIFIERAD...";
            setTimeout(() => {
                // Din personliga Tally-länk
                window.location.href = `https://tally.so/r/BzBOE4?email=${encodeURIComponent(email)}&ort=${encodeURIComponent(ort)}`;
            }, 800);
        }, 1500);
    }
</script>

</body>
</html>
