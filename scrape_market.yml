name: National Market Sync
on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Install Dependencies
        run: |
          npm install puppeteer puppeteer-extra puppeteer-extra-plugin-stealth

      - name: Run Scraper Engine
        run: node AGGREGATOR_CORE.js

      - name: Commit and Push Data
        run: |
          git config --global user.name 'AI-Bot'
          git config --global user.email 'bot@allabostader.se'
          git add market-data.json
          git commit -m "AUTO-SYNC: Real Market Data" || echo "No changes"
          git push
