name: Sync
on:
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: '20'
      - run: npm install puppeteer puppeteer-extra puppeteer-extra-plugin-stealth
      - run: node AGGREGATOR_CORE.js
