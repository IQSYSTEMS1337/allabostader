name: AGGREGATOR-X

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'

# DENNA RAD DÖDAR VARNINGARNA
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install Latest Dependencies
        # Vi lägger till --silent för att göra loggen helt ren
        run: npm install puppeteer@latest puppeteer-extra@latest puppeteer-extra-plugin-stealth@latest --no-fund --no-audit --silent

      - name: Run Scraper
        run: node AGGREGATOR_CORE.js

      - name: Save Data
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add market-data.json
          git commit -m "MARKET DATA UPDATE [AUTO]" || exit 0
          git push
