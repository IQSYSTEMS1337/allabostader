name: Allabostäder Daily Infiltration
on:
  schedule:
    - cron: '0 4 * * *' # Automatiskt varje morgon
  workflow_dispatch:   # Manuell start-knapp (viktigt för tester)

jobs:
  empire-build:
    runs-on: ubuntu-latest
    steps:
      - name: 🛰️ Infiltrate Repository
        uses: actions/checkout@v4

      - name: 🛠️ Setup Node Engine
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 📦 Install War-Tools
        run: npm install

      - name: 🚀 Execute Omni-Scraper V20
        run: node scraper.js
        env:
          NODE_ENV: production

      - name: 💾 Synchronize Empire Vault
        run: |
          git config --global user.name "Empire-Bot"
          git config --global user.email "bot@allabostader.se"
          git add market-data.json
          git commit -m "Market Update: $(date +'%Y-%m-%d %H:%M')" || exit 0
          git push
