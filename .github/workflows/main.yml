name: VOIDWALKER-V52-MONOLITH-FORCE

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  execute-empire:
    runs-on: ubuntu-latest
    steps:
      - name: 🛰️ Infiltration
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🛠️ Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: 🛡️ Noble Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgbm-dev libnss3 libatk-bridge2.0-0 libgtk-3-0 libasound2t64
          npx puppeteer browsers install chrome --with-deps

      - name: 📦 Install
        run: npm install --no-audit --no-fund --loglevel=error

      - name: 🚀 Run AGGREGATOR_CORE V52
        run: node AGGREGATOR_CORE.js
        env:
          NODE_ENV: production
          CI: true

      - name: 💾 Sync Vault
        if: always()
        run: |
          git config --global user.name "Empire-Bot"
          git config --global user.email "bot@allabostader.se"
          git add .
          git commit -m "Empire Sync V52 [Monolith Protocol]" || echo "No changes"
          git pull --rebase origin main
          git push origin main

      - name: 📦 Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

  deploy:
    needs: execute-empire
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: 🌐 Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4
