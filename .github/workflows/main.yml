name: Eternal Market Infiltration - THE MASTER VAULT

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360 
    
    permissions:
      contents: write

    steps:
      - name: 🛰️ Infiltrating Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: ⚡ Setting Up Node.js (Stable Core)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 🛠️ Installing Stealth Weaponry
        run: |
          npm install puppeteer-extra puppeteer-extra-plugin-stealth puppeteer --no-audit --no-fund --loglevel=error

      - name: 🗄️ Initializing Persistent Vault
        run: |
          if [ ! -f market-data.json ]; then
            echo "[]" > market-data.json
          fi

      - name: 🚀 Executing Aggregator
        run: node AGGREGATOR_CORE.js
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"

      - name: 🧠 Running Neural Arbitrage
        # FIX: Vi kollar om filen heter ANALYZER.js eller analyzer.js så det aldrig kraschar
        run: |
          if [ -f ANALYZER.js ]; then node ANALYZER.js; 
          elif [ -f analyzer.js ]; then node analyzer.js;
          else echo "Analyzer file not found, skipping..."; fi
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"

      - name: 🔄 Syncing & Securing Market DNA
        run: |
          git config --global user.name "Sovereign-Bot"
          git config --global user.email "bot@allabostader.se"
          
          # FIX: Vi stashar undan den nya datan temporärt, drar ner senaste från molnet, och lägger tillbaka den.
          git add market-data.json
          git stash
          git pull origin main --rebase || echo "No remote changes"
          git stash pop || echo "No stashed changes"
          
          git add market-data.json
          if git diff --staged --quiet; then
            echo "No new market DNA detected."
          else
            git commit -m "Vault Sync: $(date +'%Y-%m-%d %H:%M') [Infiltration Complete]"
            git push origin main
          fi
