name: Allabostäder Omni-Engine
on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

jobs:
  execute-empire:
    runs-on: ubuntu-latest
    steps:
      - name: 🛰️ Infiltrate Repository
        uses: actions/checkout@v4

      - name: 🛠️ Setup Node Engine (Apex Version)
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 📦 Install War-Tools
        run: npm install

      - name: 🚀 Execute AGGREGATOR_CORE (Data Extraction)
        run: node AGGREGATOR_CORE.js
        env:
          NODE_ENV: production

      - name: 📊 Execute Analyzer (Market Intelligence)
        run: node analyzer.js || echo "Analyzer bypass"

      - name: 🌐 Execute SEO Empire Generator (Domination)
        run: node SEO_EMPIRE_GENERATOR.js

      - name: 💾 Synchronize Empire Vault & SEO
        run: |
          git config --global user.name "Empire-Bot"
          git config --global user.email "bot@allabostader.se"
          git add .
          git commit -m "Empire Sync: $(date +'%Y-%m-%d %H:%M') [DATA + SEO + UI]" || exit 0
          git push
