name: 👁️ ETERNAL MATRIX INFILTRATION - THE MASTER VAULT

on:
  schedule:
    - cron: '*/15 * * * *' # Infiltrerar varje kvart för total dominans
  workflow_dispatch:      # Manuell trigger för omedelbar attack

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360  # Sex timmar av oavbruten dataskörd
    
    steps:
      - name: 🛰️ INFILTRATING REPOSITORY
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Hämtar hela historiken för säker synk

      - name: ⚡ SETTING UP NODE.JS (STABLE CORE V20)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 🛠️ INSTALLING STEALTH WEAPONRY
        # Installerar ALLT: Puppeteer för skrapning + Axios/Fs för analys
        run: |
          npm install puppeteer-extra puppeteer-extra-plugin-stealth puppeteer axios fs path --no-audit --no-fund --loglevel=error

      - name: 🗄️ INITIALIZING PERSISTENT VAULT
        run: |
          if [ ! -f market-data.json ]; then
            echo "[]" > market-data.json
          fi

      - name: 🚀 EXECUTING AGGREGATOR (RAW HARVEST)
        # Maxar minnet till 4GB för att hantera tiotusentals hus utan krasch
        run: node AGGREGATOR_CORE.js
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"

      - name: 🧠 RUNNING 100-POINT NEURAL ARBITRAGE
        # Kör din ANALYZER oavsett filnamn och applicerar 100-punktsprotokollet
        run: |
          if [ -f ANALYZER.js ]; then node ANALYZER.js; 
          elif [ -f analyzer.js ]; then node analyzer.js;
          else echo "!! ANALYZER NOT FOUND - CRITICAL ERROR !!"; exit 1; fi
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"

      - name: 🔄 SYNCING & SECURING MARKET DNA (REBASE PROTOCOL)
        # Detta är den viktigaste biten för att slippa manuellt strul
        run: |
          git config --global user.name "Sovereign-Bot"
          git config --global user.email "bot@allabostader.se"
          
          # 1. Lägg till den nya, analyserade datan
          git add market-data.json
          
          # 2. Stash:a undan den lokala ändringen temporärt
          git stash
          
          # 3. Pull:a de senaste ändringarna från GitHub (om du ändrat index.html t.ex.)
          git pull origin main --rebase || echo "No remote changes to merge"
          
          # 4. Lägg tillbaka den nya datan ovanpå
          git stash pop || echo "No stashed changes"
          
          # 5. Commit & Push
          git add market-data.json
          if git diff --staged --quiet; then
            echo "No changes in Market DNA. Standing by."
          else
            git commit -m "Vault Sync: $(date +'%Y-%m-%d %H:%M') [100-POINT ANALYZED]"
            git push origin main
          fi
