name: 🌐 Allabostäder Omni-Engine: VOIDWALKER V34

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

concurrency:
  group: empire-engine
  cancel-in-progress: false

permissions:
  contents: write

# ABSOLUT SYSTEM-OVERRIDE: Tvingar GitHub att köra allt på Node 24
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

jobs:
  execute-empire:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    
    steps:
      - name: 🛰️ Infiltrate Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🛠️ Setup Node Engine (Apex 24)
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: 🛡️ Install Chrome System Dependencies
        # Fix för Ubuntu 24.04 (Noble): Vi installerar libasound2t64 istället för libasound2
        run: |
          sudo apt-get update
          sudo apt-get install -y libgbm-dev libnss3 libatk-bridge2.0-0 libgtk-3-0 libasound2t64
          npx puppeteer browsers install chrome --with-deps

      - name: 📦 Install War-Tools (Silent Mode)
        run: npm install --no-audit --no-fund --loglevel=error

      - name: 🚀 Execute AGGREGATOR_CORE (Data Extraction)
        run: node AGGREGATOR_CORE.js
        env:
          NODE_ENV: production
          CI: true

      - name: 📊 Execute Analyzer (Market Intelligence)
        run: node analyzer.js || echo ">> [WARN] Analyzer bypassed."
        continue-on-error: true

      - name: 🕸️ Execute SEO Empire Generator (Domination)
        run: node SEO_EMPIRE_GENERATOR.js || echo ">> [WARN] SEO Generator bypassed."
        continue-on-error: true

      - name: 💾 Synchronize Empire Vault & SEO
        if: always()
        run: |
          git config --global user.name "Empire-Bot"
          git config --global user.email "bot@allabostader.se"
          
          if [[ -n "$(git status --porcelain)" ]]; then
            TIMESTAMP=$(TZ=Europe/Stockholm date +'%Y-%m-%d %H:%M')
            git add .
            git commit -m "Empire Sync: $TIMESTAMP [VOIDWALKER V34 - TOTAL FORCE]"
            git pull --rebase origin main
            git push origin main
          else
            echo ">> [INFO] No changes detected. Skipping commit."
          fi
