name: VOIDWALKER-V27
on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:
concurrency:
  group: empire-engine
  cancel-in-progress: false
permissions:
  contents: write
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
jobs:
  execute-empire:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: SetupNode
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - name: Install-Deps
        # Vi installerar bara bas-biblioteken och låter Puppeteer fixa resten
        run: |
          sudo apt-get update
          sudo apt-get install -y libgbm-dev libnss3 libatk-bridge2.0-0 libgtk-3-0
          npx puppeteer browsers install chrome --with-deps
      - name: Install-NPM
        run: npm install --no-audit --no-fund --loglevel=error
      - name: Run-Core
        run: node AGGREGATOR_CORE.js
        env:
          NODE_ENV: production
          CI: true
      - name: Sync
        if: always()
        run: |
          git config --global user.name "Empire-Bot"
          git config --global user.email "bot@allabostader.se"
          if [[ -n "$(git status --porcelain)" ]]; then
            git add .
            git commit -m "Empire Sync V27 [Noble-Fix]"
            git pull --rebase origin main
            git push origin main
          fi
