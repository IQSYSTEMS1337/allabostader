name: VOIDWALKER-V60-SOVEREIGN

on:
  workflow_dispatch:
  schedule:
    - cron: '0 4 * * *'

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  execute-empire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libgbm-dev libnss3 libatk-bridge2.0-0 libgtk-3-0 libasound2t64
          npx puppeteer browsers install chrome --with-deps
      - run: npm install
      - run: node AGGREGATOR_CORE.js
      - name: Sync
        run: |
          git config --global user.name "Empire-Bot"
          git config --global user.email "bot@allabostader.se"
          git add .
          git commit -m "Empire Sync V60" || echo "No changes"
          git push origin main
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

  deploy:
    needs: execute-empire
    environment:
      name: github-pages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/deploy-pages@v4
