name: Eternal Market Infiltration

on:
  schedule:
    - cron: '*/10 * * * *' # KÖR VAR 10:E MINUT NU
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm install --no-audit --no-fund --loglevel=error

      - name: Deep Infiltration
        # Vi lägger till en miljövariabel som säger åt skrapan att köra DJUPT
        run: node AGGREGATOR_CORE.js --depth=MAX --shards=300
        env:
          PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: false

      - name: Neural Arbitrage
        run: node analyzer.js

      - name: Sync Vault
        run: |
          git config --global user.name "Sovereign-Bot"
          git config --global user.email "bot@sovereign.ai"
          git add market-data.json
          git commit -m "Infiltration Level Up: $(date)" || exit 0
          git push
