name: Allabostäder Empire Update
on:
  schedule:
    - cron: '0 4 * * *' # Körs kl 04:00 varje morgon
  workflow_dispatch:   # Gör att du kan dundra igång den manuellt

jobs:
  run-core:
    runs-on: ubuntu-latest
    steps:
      - name: 🛰️ Infiltrate Repo
        uses: actions/checkout@v4

      - name: 🛠️ Setup Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 📦 Install War-Tools
        run: npm install

      - name: 🚀 Execute AGGREGATOR_CORE
        run: node AGGREGATOR_CORE.js
        env:
          NODE_ENV: production

      - name: 📊 Run Analyzer
        run: node analyzer.js

      - name: 💾 Synchronize Vault
        run: |
          git config --global user.name "Empire-Bot"
          git config --global user.email "bot@allabostader.se"
          git add market-data.json
          git commit -m "Vault Sync: $(date +'%Y-%m-%d %H:%M') [100-POINT ANALYZED]" || exit 0
          git push
