name: 🌐 Allabostäder Omni-Engine: VOIDWALKER V22

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

concurrency:
  group: empire-engine
  cancel-in-progress: false

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  execute-empire:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    
    steps:
      - name: 🛰️ Infiltrate Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🛠️ Setup Node Engine (Apex 24)
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: 🛡️ Install Chrome System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgbm-dev libnss3 libatk-bridge2.0-0 libgtk-3-0 libasound2 libx11-xcb1 libxss1 libnss3 libasound2 libatk1.0-0 libc6 libcairo2 libcups2 libdbus-1-3 libexpat1 libfontconfig1 libgcc1 libgconf-2-4 libgdk-pixbuf2.0-0 libglib2.0-0 libgtk-3-0 libnspr4 libpango-1.0-0 libpangocairo-1.0-0 libstdc++6 libx11-6 libx11-xcb1 libxcb1 libxcomposite1 libxcursor1 libxdamage1 libxext6 libxfixes3 libxi6 libxrandr2 libxrender1 libxtst6 ca-certificates fonts-liberation libappindicator1 lsb-release xdg-utils wget
          npx puppeteer browsers install chrome

      - name: 📦 Install War-Tools (Silent Mode)
        run: npm install --no-audit --no-fund --loglevel=error

      - name: 🚀 Execute AGGREGATOR_CORE (Data Extraction)
        run: node AGGREGATOR_CORE.js
        env:
          NODE_ENV: production
          CI: true

      - name: 📊 Execute Analyzer (Market Intelligence)
        run: node analyzer.js || echo ">> [WARN] Analyzer bypassed."
        continue-on-error: true

      - name: 🕸️ Execute SEO Empire Generator (Domination)
        run: node SEO_EMPIRE_GENERATOR.js || echo ">> [WARN] SEO Generator bypassed."
        continue-on-error: true

      - name: 💾 Synchronize Empire Vault & SEO
        if: always()
        run: |
          git config --global user.name "Empire-Bot"
          git config --global user.email "bot@allabostader.se"
          
          if [[ -n "$(git status --porcelain)" ]]; then
            TIMESTAMP=$(TZ=Europe/Stockholm date +'%Y-%m-%d %H:%M')
            git add .
            git commit -m "Empire Sync: $TIMESTAMP [NODE 24 UPGRADE]"
            git pull --rebase origin main
            git push origin main
          else
            echo ">> [INFO] No changes detected. Skipping commit."
          fi
