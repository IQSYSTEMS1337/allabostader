name: VOIDWALKER-V47-SINGULARITY-FORCE

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  execute-empire:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: 🛰️ Infiltration
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🛠️ Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: 🛡️ Install Noble Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgbm-dev libnss3 libatk-bridge2.0-0 libgtk-3-0 libasound2t64
          npx puppeteer browsers install chrome --with-deps

      - name: 📦 Install War-Tools
        run: npm install --no-audit --no-fund --loglevel=error

      - name: 🚀 Run AGGREGATOR_CORE V47
        run: node AGGREGATOR_CORE.js
        env:
          NODE_ENV: production
          CI: true

      - name: 💾 Synchronize Vault
        if: always()
        run: |
          git config --global user.name "Empire-Bot"
          git config --global user.email "bot@allabostader.se"
          git add .
          git commit -m "Empire Sync V47 [Singularity Protocols]" || echo "No changes"
          git pull --rebase origin main
          git push origin main

  deploy:
    needs: execute-empire
    runs-on: ubuntu-latest
    steps:
      - name: 🛰️ Checkout
        uses: actions/checkout@v4
      - name: 🌐 Deploy to Empire Pages
        uses: actions/deploy-pages@v4
