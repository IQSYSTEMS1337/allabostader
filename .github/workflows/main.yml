name: Eternal Market Infiltration

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20' # Uppgraderat till v20 för bättre stöd

      - name: Install Dependencies
        # Vi lägger till --no-audit och struntar i varningar helt
        run: |
          npm install --no-audit --no-fund --loglevel=error || npm install --legacy-peer-deps

      - name: Run Aggregator
        # Om den dör här, skrivs felet ut men bygget stoppas inte helt
        run: node AGGREGATOR_CORE.js || echo "Aggregator slutförd med varningar."

      - name: Run Analyzer
        run: node analyzer.js

      - name: Commit & Push Changes
        run: |
          git config --global user.name "Sovereign-Bot"
          git config --global user.email "bot@sovereign.ai"
          git add market-data.json
          git commit -m "Auto-Update: $(date)" || exit 0
          git push
