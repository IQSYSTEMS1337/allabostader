<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <title>Allabostäder | Empire Slayer V55</title>
    <style>
        :root { --gold: #c2995b; --bg: #000; --card: #0a0a0a; }
        body { background: #000; color: #fff; font-family: 'Inter', sans-serif; margin: 0; padding: 20px; }
        header { padding: 40px; text-align: center; border-bottom: 1px solid #222; }
        #main-logo { height: 180px; filter: drop-shadow(0 0 20px var(--gold)); }
        
        /* Debug-fönster: Visas bara om det blir fel */
        #debug-console { 
            background: #200; border: 2px solid red; padding: 20px; 
            margin: 20px; border-radius: 10px; display: none; color: #ff0000; font-family: monospace;
        }

        #empire-grid { 
            display: grid; grid-template-columns: repeat(auto-fill, minmax(400px, 1fr)); 
            gap: 30px; margin-top: 40px; 
        }
        .card { background: var(--card); border: 1px solid #222; border-radius: 15px; overflow: hidden; padding-bottom: 20px; }
        .map { height: 250px; background-color: #111; background-size: cover; }
        .info { padding: 20px; }
        .price { color: var(--gold); font-size: 2rem; font-weight: 900; }
    </style>
</head>
<body>

<header>
    <img src="logo.jpg" id="main-logo" onerror="this.src='logo.png'">
</header>

<div id="debug-console"></div>
<div id="empire-grid">Väntar på data från valvet...</div>

<script>
    const API_KEY = 'AIzaSyA...'; // DIN NYCKEL HÄR

    async function slayerInit() {
        const debug = document.getElementById('debug-console');
        const grid = document.getElementById('empire-grid');

        try {
            console.log("Inleder infiltration av market-data.json...");
            const res = await fetch('market-data.json?v=' + Date.now());
            
            if (!res.ok) throw new Error("Kunde inte hämta market-data.json. Status: " + res.status);
            
            const rawData = await res.json();
            console.log("Data hämtad:", rawData);

            // Kolla om data faktiskt är en array
            const dataArray = Array.isArray(rawData) ? rawData : (rawData.objects || Object.values(rawData));
            
            if (!dataArray || dataArray.length === 0) {
                grid.innerHTML = "<h1>VALVET ÄR TOMT. Boten har inte levererat någon data än.</h1>";
                return;
            }

            grid.innerHTML = ""; // Rensa "Väntar..."
            
            dataArray.forEach(i => {
                // Robust mapping: hanterar ALLA tidigare versioner av bot-data
                const addr = (i.a || i.address || "Okänd adress").replace(/IDAG|ALPHA_HN|NYHET/gi, '').trim();
                const price = i.p || i.price || 0;
                const link = i.u || i.url || "#";
                
                const mapUrl = `https://maps.googleapis.com/maps/api/staticmap?center=${encodeURIComponent(addr + ', Sverige')}&zoom=18&size=600x400&maptype=satellite&key=${API_KEY}`;

                grid.innerHTML += `
                    <div class="card" onclick="window.open('${link}')">
                        <div class="map" style="background-image: url('${mapUrl}')"></div>
                        <div class="info">
                            <div class="price">${price.toLocaleString('sv-SE')} kr</div>
                            <div class="address">${addr}</div>
                            <div style="margin-top:10px; font-size:0.7rem; color:#444;">V-INDEX: ${i.vI || i.vIndex || 0}%</div>
                        </div>
                    </div>
                `;
            });

        } catch (err) {
            console.error("SLAYER ERROR:", err);
            debug.style.display = "block";
            debug.innerHTML = "<strong>SYSTEMFEL:</strong><br>" + err.message + "<br><br>Kolla konsolen (F12) för detaljer.";
            grid.innerHTML = "Infiltrationen misslyckades.";
        }
    }

    slayerInit();
</script>
</body>
</html>
