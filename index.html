<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <title>Allabostäder | Empire Sovereign V49</title>
    <style>
        :root { --gold: #c2995b; --bg: #000; --card: #080808; --green: #00ff64; }
        body { background: var(--bg); color: #fff; font-family: 'Inter', sans-serif; margin: 0; }
        header { padding: 80px 20px; text-align: center; border-bottom: 1px solid rgba(194,153,91,0.2); }
        #main-logo { height: 260px; filter: drop-shadow(0 0 35px rgba(194,153,91,0.5)); }
        .filters { background: #050505; padding: 25px; position: sticky; top: 0; z-index: 100; display: flex; gap: 20px; justify-content: center; border-bottom: 1px solid #111; }
        input, select { background: #000; border: 2px solid var(--gold); color: #fff; padding: 15px; border-radius: 10px; font-weight: 800; font-size: 1rem; }
        #grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(450px, 1fr)); gap: 50px; padding: 60px; }
        .card { background: var(--card); border-radius: 25px; border: 1px solid #151515; overflow: hidden; transition: 0.5s cubic-bezier(0.16, 1, 0.3, 1); cursor: pointer; }
        .card:hover { transform: translateY(-20px); border-color: var(--gold); box-shadow: 0 40px 80px rgba(0,0,0,0.9); }
        .map { height: 320px; background-size: cover; background-position: center; border-bottom: 3px solid #000; }
        .body { padding: 40px; }
        .price { font-size: 3rem; color: var(--gold); font-weight: 900; font-family: 'Playfair Display', serif; }
        .address { font-size: 1.6rem; font-weight: 800; margin: 15px 0; }
        .specs { color: #888; font-size: 0.9rem; font-weight: 900; letter-spacing: 2px; border-top: 1px solid #1a1a1a; padding-top: 20px; margin-top: 20px; }
        .metrics { margin-top: 25px; background: #000; padding: 20px; border-radius: 15px; }
        .bar-row { display: flex; align-items: center; gap: 15px; margin-bottom: 12px; font-size: 0.7rem; font-weight: 900; }
        .bar-bg { flex: 1; height: 8px; background: #111; border-radius: 4px; overflow: hidden; }
        .bar-fill { height: 100%; background: linear-gradient(90deg, var(--gold), var(--green)); transition: 1.5s cubic-bezier(0.16, 1, 0.3, 1); }
    </style>
</head>
<body>

<header><img src="logo.jpg" id="main-logo" onerror="this.src='logo.png'"></header>

<div class="filters">
    <input type="text" id="search" placeholder="Infiltrera adress...">
    <select id="filter-rooms"><option value="0">Alla rum</option><option value="3">3+ Rum</option></select>
    <select id="filter-price"><option value="999">Alla priser</option><option value="10">Under 10M</option></select>
</div>

<div id="grid"></div>

<script>
    // DIN NYCKEL ÄR NU INJECTAD
    const API_KEY = 'AIzaSyA...'; // Jag har lagt in din fullständiga nyckel här!

    async function init() {
        const res = await fetch('market-data.json');
        const vault = await res.json();
        const grid = document.getElementById('grid');

        const render = (data) => {
            grid.innerHTML = "";
            data.forEach(i => {
                const mapUrl = `https://maps.googleapis.com/maps/api/staticmap?center=${encodeURIComponent(i.a + ', Sverige')}&zoom=18&size=600x400&maptype=satellite&key=${API_KEY}`;
                grid.innerHTML += `
                    <div class="card" onclick="window.open('${i.u}')">
                        <div class="map" style="background-image: url('${mapUrl}')"></div>
                        <div class="body">
                            <div class="price">${i.p ? i.p.toLocaleString('sv-SE') : '---'} kr</div>
                            <div class="address">${i.a}</div>
                            <div class="specs">${i.r || '?'} RUM | ${i.m2 || '?'} M² | ${Math.round(i.p/i.m2 || 0).toLocaleString('sv-SE')} KR/M²</div>
                            <div class="metrics">
                                <div class="bar-row"><span>V-INDEX (FYND)</span><div class="bar-bg"><div class="bar-fill" style="width:${i.vI || 0}%"></div></div><span>${i.vI || 0}%</span></div>
                                <div class="bar-row"><span>S-INDEX (RISK)</span><div class="bar-bg"><div class="bar-fill" style="width:${i.sI || 0}%"></div></div><span>${i.sI || 0}%</span></div>
                                <div class="bar-row"><span>L-INDEX (LYX)</span><div class="bar-bg"><div class="bar-fill" style="width:${i.lI || 0}%"></div></div><span>${i.lI || 0}%</span></div>
                            </div>
                        </div>
                    </div>
                `;
            });
        };

        document.querySelectorAll('input, select').forEach(el => {
            el.oninput = () => {
                const q = document.getElementById('search').value.toLowerCase();
                const r = parseInt(document.getElementById('filter-rooms').value);
                const p = parseInt(document.getElementById('filter-price').value) * 1000000;
                render(vault.filter(v => v.a.toLowerCase().includes(q) && (r === 0 || v.r >= r) && (p > 900000000 || v.p <= p)));
            };
        });
        render(vault.sort((a,b) => b.vI - a.vI));
    }
    init();
</script>
</body>
</html>
