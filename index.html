<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <title>ALLABOSTÄDER | TOTAL MATRIS</title>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;800&family=Outfit:wght@900&display=swap" rel="stylesheet">
    <style>
        :root { --neon: #00f2ff; --eco: #00ff88; --bg: #000; --border: rgba(255, 255, 255, 0.1); }
        body { background: var(--bg); color: #fff; font-family: 'JetBrains Mono', monospace; margin: 0; overflow-x: hidden; }
        header { padding: 30px 50px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; background: rgba(0,0,0,0.9); position: sticky; top: 0; z-index: 100; }
        .hero { padding: 80px 50px; text-align: center; border-bottom: 1px solid var(--border); }
        h1 { font-family: 'Outfit', sans-serif; font-size: 8vw; letter-spacing: -5px; margin: 0; text-transform: uppercase; }
        
        .search-container { max-width: 900px; margin: 40px auto; display: flex; border: 1px solid var(--neon); background: rgba(0,242,255,0.05); }
        input { flex: 1; background: transparent; border: none; padding: 25px; color: #fff; font-family: 'JetBrains Mono'; font-size: 18px; outline: none; }
        
        #market-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(350px, 1fr)); gap: 1px; background: var(--border); }
        .card { background: #000; padding: 30px; transition: 0.3s; position: relative; border: 1px solid transparent; }
        .card:hover { background: #050505; border-color: var(--neon); }
        
        .ai-tag { font-size: 10px; color: var(--neon); border: 1px solid var(--neon); padding: 3px 8px; display: inline-block; margin-bottom: 15px; }
        .addr { font-family: 'Outfit', sans-serif; font-size: 24px; margin-bottom: 5px; }
        .loc { font-size: 12px; opacity: 0.6; margin-bottom: 20px; }
        
        .vitals { background: rgba(255,255,255,0.03); padding: 15px; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; border: 1px solid var(--border); }
        .vital-box small { display: block; font-size: 8px; opacity: 0.5; text-transform: uppercase; }
        .vital-box b { font-size: 14px; color: var(--eco); }

        #log { position: fixed; bottom: 20px; left: 20px; font-size: 10px; color: var(--neon); opacity: 0.7; pointer-events: none; }
    </style>
</head>
<body>

<header>
    <div style="font-weight: 800; letter-spacing: 2px;">ALLABOSTÄDER_CORE_v2.6</div>
    <div id="clock">00:00:00</div>
</header>

<section class="hero">
    <h1>SÖK_ALLT.</h1>
    <div class="search-container">
        <input type="text" id="searchInp" placeholder="ORT, KOMMUN ELLER ADRESS..." oninput="filterData()">
    </div>
</section>

<main id="market-grid"></main>
<div id="log">> SYSTEM_IDLE_READY</div>

<script>
    let rawData = [];

    // HÄMTA DATA FRÅN GITHUB-BOTENS FIL
    async function loadMarket() {
        try {
            const res = await fetch('market-data.json');
            rawData = await res.json();
            render(rawData);
            document.getElementById('log').innerText = `> SYNC_COMPLETE: ${rawData.length}_OBJECTS_LOADED`;
        } catch (e) {
            document.getElementById('log').innerText = `> ERR: VÄNTAR_PÅ_FÖRSTA_SKANNING...`;
        }
    }

    function render(data) {
        const grid = document.getElementById('market-grid');
        grid.innerHTML = data.map(h => {
            // AI-LOGIK: Räkna ut ränte-sparande (simulerat 1.2% sänkning)
            const savings = Math.floor(h.priceVal * 0.012 / 12) || 0;
            
            return `
                <div class="card">
                    <div class="ai-tag">SOURCE: ${h.source.toUpperCase()}</div>
                    <div class="addr">${h.address.toUpperCase()}</div>
                    <div class="loc">${h.location.toUpperCase()}</div>
                    <div class="vitals">
                        <div class="vital-box">
                            <small>PRIS</small>
                            <b>${h.price}</b>
                        </div>
                        <div class="vital-box">
                            <small>AI_MÅNADS_SPAR</small>
                            <b>+${savings} KR</b>
                        </div>
                    </div>
                </div>
            `;
        }).join('');
    }

    function filterData() {
        const val = document.getElementById('searchInp').value.toLowerCase();
        const filtered = rawData.filter(h => 
            h.address.toLowerCase().includes(val) || 
            h.location.toLowerCase().includes(val) ||
            h.source.toLowerCase().includes(val)
        );
        render(filtered);
    }

    setInterval(() => { document.getElementById('clock').innerText = new Date().toLocaleTimeString(); }, 1000);
    window.onload = loadMarket;
</script>
</body>
</html>
