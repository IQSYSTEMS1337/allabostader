<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ALLABOSTÄDER // OMNI-RECORDS_v5.0</title>
    <style>
        :root { --neon: #00ff41; --dark: #000500; --glitch: #ff003c; --gold: #ffcc00; }
        * { box-sizing: border-box; cursor: crosshair; }
        body { background: var(--dark); color: var(--neon); font-family: 'Segoe UI', 'Courier New', monospace; margin: 0; overflow-x: hidden; }

        /* HEADER & STATS */
        .terminal-header { padding: 40px 20px; border-bottom: 1px solid var(--neon); background: rgba(0, 10, 0, 0.9); position: sticky; top: 0; z-index: 100; backdrop-filter: blur(10px); }
        h1 { margin: 0; font-size: 1.5rem; letter-spacing: 5px; text-shadow: 0 0 10px var(--neon); }
        .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-top: 20px; }
        .stat-card { border-left: 3px solid var(--neon); padding-left: 15px; }
        .stat-val { font-size: 1.8rem; font-weight: bold; color: #fff; }

        /* SEARCH ENGINE */
        .search-container { margin-top: 30px; position: relative; }
        #search { width: 100%; background: #001100; border: 1px solid var(--neon); padding: 20px; color: var(--neon); font-size: 1.2rem; outline: none; transition: 0.3s; }
        #search:focus { box-shadow: 0 0 20px rgba(0, 255, 65, 0.3); background: #002200; }

        /* THE GRID */
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 10px; padding: 20px; }
        
        /* THE CARDS */
        .card { background: #000800; border: 1px solid #002200; padding: 15px; text-decoration: none; color: inherit; position: relative; overflow: hidden; transition: 0.2s; }
        .card:hover { border-color: var(--neon); background: #001500; transform: scale(1.02); z-index: 10; }
        .card::before { content: ""; position: absolute; top: 0; left: -100%; width: 100%; height: 2px; background: var(--neon); transition: 0.5s; }
        .card:hover::before { left: 0; }

        .badge { display: inline-block; padding: 2px 8px; font-size: 0.65rem; font-weight: bold; margin-bottom: 10px; border-radius: 2px; }
        .b-sold { background: #555; color: #fff; }
        .b-kommande { background: var(--glitch); color: #fff; animation: blink 1s infinite; }
        .b-tillsalu { background: var(--neon); color: #000; }
        
        .addr { font-size: 1rem; font-weight: bold; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .src { color: #008800; font-size: 0.7rem; margin-top: 5px; display: flex; justify-content: space-between; }

        @keyframes blink { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }

        /* SCROLLBAR */
        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-track { background: #000; }
        ::-webkit-scrollbar-thumb { background: var(--neon); }
    </style>
</head>
<body>

<div class="terminal-header">
    <h1>ALLABOSTÄDER // OMNI-DATA ENGINE</h1>
    <div class="stats-grid">
        <div class="stat-card">
            <div class="stat-val" id="total-val">0</div>
            <div style="font-size: 0.7rem;">TOTALT_INDEXERADE</div>
        </div>
        <div class="stat-card">
            <div class="stat-val" style="color: var(--glitch);" id="kommande-val">0</div>
            <div style="font-size: 0.7rem;">PRE_MARKET_ALERTS</div>
        </div>
        <div class="stat-card">
            <div class="stat-val" style="color: var(--gold);" id="speed-val">0.2ms</div>
            <div style="font-size: 0.7rem;">SEARCH_LATENCY</div>
        </div>
    </div>
    
    <div class="search-container">
        <input type="text" id="search" placeholder="SYSTEM_QUERY: SKRIV STAD, ADRESS ELLER STATUS...">
    </div>
</div>

<div id="valvet" class="grid">
    </div>

<script>
    let db = [];
    const valvet = document.getElementById('valvet');
    const searchInput = document.getElementById('search');

    async function launchEngine() {
        try {
            const start = performance.now();
            const response = await fetch('market-data.json?v=' + Date.now());
            db = await response.json();
            const end = performance.now();

            document.getElementById('total-val').innerText = db.length.toLocaleString();
            document.getElementById('kommande-val').innerText = db.filter(x => x.t.includes('KOMMANDE')).length;
            document.getElementById('speed-val').innerText = (end - start).toFixed(1) + "ms";

            render(db.slice(0, 1000)); // Vi börjar med de 1000 senaste för att spara RAM
        } catch (e) {
            valvet.innerHTML = "<h1>ERROR: DATABASE_OFFLINE</h1>";
        }
    }

    function render(data) {
        valvet.innerHTML = data.map(h => `
            <a href="${h.u}" target="_blank" class="card">
                <div class="badge ${getBadgeClass(h.t)}">${h.t}</div>
                <div class="addr">${h.a}</div>
                <div class="src">
                    <span>${h.s}</span>
                    <span>${h.d}</span>
                </div>
            </a>
        `).join('');
    }

    function getBadgeClass(status) {
        if(status.includes('SÅLD')) return 'b-sold';
        if(status.includes('KOMMANDE')) return 'b-kommande';
        return 'b-tillsalu';
    }

    searchInput.addEventListener('input', (e) => {
        const term = e.target.value.toLowerCase();
        if(term.length < 2) { render(db.slice(0, 1000)); return; }
        
        const filtered = db.filter(h => 
            h.a.toLowerCase().includes(term) || 
            h.s.toLowerCase().includes(term)
        ).slice(0, 500); // Visa max 500 vid sökning för blixtsnabb respons
        
        render(filtered);
    });

    launchEngine();
</script>

</body>
</html>
