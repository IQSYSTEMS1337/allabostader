<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <title>Allabostäder | Sovereign V60</title>
    <style>
        :root { --gold: #c2995b; --bg: #000; --card: #080808; }
        body { background: #000; color: #fff; font-family: 'Inter', sans-serif; margin: 0; }
        header { padding: 60px 20px; text-align: center; border-bottom: 1px solid rgba(194,153,91,0.2); }
        #main-logo { height: 240px; filter: drop-shadow(0 0 30px var(--gold)); }
        #grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(450px, 1fr)); gap: 40px; padding: 50px; }
        .card { background: var(--card); border: 1px solid #1a1a1a; border-radius: 25px; overflow: hidden; cursor: pointer; }
        .map { height: 300px; background-size: cover; background-position: center; background-color: #111; }
        .body { padding: 30px; }
        .price { font-size: 2.8rem; color: var(--gold); font-weight: 900; }
        .metrics { margin-top: 20px; background: #000; padding: 20px; border-radius: 15px; }
        .bar-bg { height: 8px; background: #111; border-radius: 4px; margin: 10px 0; overflow: hidden; }
        .bar-fill { height: 100%; background: var(--gold); transition: 1s; }
    </style>
</head>
<body>
    <header><img src="logo.jpg" id="main-logo" onerror="this.src='logo.png'"></header>
    <div id="grid">Väntar på valvet...</div>

    <script>
        // KLISTRA IN DIN FULLSTÄNDIGA NYCKEL HÄR:
        const API_KEY = 'HÄR_KLISTRAR_DU_IN_DIN_FULLA_AIza_NYCKEL'; 

        async function init() {
            const grid = document.getElementById('grid');
            try {
                const res = await fetch('market-data.json?v=' + Date.now());
                const vault = await res.json();
                grid.innerHTML = "";
                
                vault.forEach(i => {
                    const cleanA = (i.a || "Okänd").replace(/ALPHA_HN|IDAG|NYHET/gi, '').trim();
                    const mapUrl = `https://maps.googleapis.com/maps/api/staticmap?center=${encodeURIComponent(cleanA + ', Sverige')}&zoom=18&size=600x400&maptype=satellite&key=${API_KEY}`;
                    
                    grid.innerHTML += `
                        <div class="card" onclick="window.open('${i.u}')">
                            <div class="map" style="background-image: url('${mapUrl}')"></div>
                            <div class="body">
                                <div class="price">${(i.p || 0).toLocaleString('sv-SE')} kr</div>
                                <div class="address">${cleanA}</div>
                                <div class="metrics">
                                    <span>V-INDEX: ${i.vI || 0}%</span>
                                    <div class="bar-bg"><div class="bar-fill" style="width:${i.vI || 0}%"></div></div>
                                </div>
                            </div>
                        </div>`;
                });
            } catch (e) { grid.innerHTML = "FEL VID INFILTRATION: " + e.message; }
        }
        init();
    </script>
</body>
</html>
