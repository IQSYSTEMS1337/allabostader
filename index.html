<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <title>ALLABOSTÄDER | MATRIX</title>
    <style>
        :root { --neon: #00f2ff; --bg: #000; }
        body { background: var(--bg); color: var(--neon); font-family: 'Courier New', monospace; padding: 20px; }
        .search-box { width: 100%; padding: 20px; background: #111; border: 2px solid var(--neon); color: #fff; font-size: 20px; margin-bottom: 30px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; }
        .card { border: 1px solid var(--neon); padding: 20px; background: rgba(0, 242, 255, 0.05); position: relative; }
        .source-tag { position: absolute; top: 5px; right: 5px; font-size: 10px; background: var(--neon); color: #000; padding: 2px 5px; }
        .ai-vitals { margin-top: 15px; border-top: 1px dotted var(--neon); padding-top: 10px; color: #00ff88; font-size: 12px; }
    </style>
</head>
<body>
    <h1>SYSTEM_ALLABOSTÄDER_v2.6</h1>
    
    <input type="text" id="search" class="search-box" placeholder="SÖK EFTER ORT ELLER ADRESS..." oninput="filterData()">

    <div id="grid" class="grid">LADDAR MATRIS...</div>

    <script>
        let marketData = [];

        async function init() {
            try {
                const res = await fetch('market-data.json');
                marketData = await res.json();
                render(marketData);
            } catch (e) {
                document.getElementById('grid').innerHTML = "SYSTEM ERROR: Kör AGGREGATOR-X på GitHub först.";
            }
        }

        function render(data) {
            const grid = document.getElementById('grid');
            if (data.length === 0) {
                grid.innerHTML = "INGA OBJEKT HITTADES.";
                return;
            }
            grid.innerHTML = data.map(h => `
                <div class="card">
                    <div class="source-tag">${h.source}</div>
                    <div style="font-size: 1.4em; font-weight: bold;">${h.address}</div>
                    <div style="opacity: 0.8;">${h.location}</div>
                    <div style="font-size: 1.2em; margin-top: 10px;">${h.price}</div>
                    <div class="ai-vitals">
                        AI_STATUS: POSITIV<br>
                        BERÄKNAD RÄNTA: 3.2% (AI-PROGNOS)
                    </div>
                </div>
            `).join('');
        }

        // SÖKFUNKTIONEN
        function filterData() {
            const term = document.getElementById('search').value.toLowerCase();
            const filtered = marketData.filter(h => 
                h.address.toLowerCase().includes(term) || 
                h.location.toLowerCase().includes(term) ||
                h.source.toLowerCase().includes(term)
            );
            render(filtered);
        }

        init();
    </script>
</body>
</html>
