<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MARKNADSTERMINAL</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root { --accent: #3b82f6; --danger: #ef4444; --bg: #050505; }
        body { 
            background: var(--bg); 
            color: #fff; 
            font-family: 'Inter', sans-serif; 
            letter-spacing: -0.02em;
            -webkit-tap-highlight-color: transparent;
            margin: 0;
            padding: 0;
        }
        .glass { 
            background: rgba(20, 20, 20, 0.7); 
            backdrop-filter: blur(20px); 
            border: 1px solid rgba(255,255,255,0.05); 
        }
        .card { 
            transition: transform 0.2s ease, border-color 0.3s ease; 
            border-radius: 2.5rem; 
        }
        .card:active { transform: scale(0.98); }
        
        .panic-mode { 
            border: 2px solid rgba(239, 68, 68, 0.5) !important; 
            box-shadow: 0 0 30px rgba(239, 68, 68, 0.15); 
            animation: pulse-border 2s infinite;
        }
        @keyframes pulse-border {
            0% { border-color: rgba(239, 68, 68, 0.3); }
            50% { border-color: rgba(239, 68, 68, 0.7); }
            100% { border-color: rgba(239, 68, 68, 0.3); }
        }

        .main-logo {
            width: 220px;
            height: 220px;
            object-fit: contain;
            filter: drop-shadow(0 0 30px rgba(59, 130, 246, 0.4));
            margin-bottom: 1rem;
        }
    </style>
</head>
<body class="p-4 md:p-12 pb-32">

    <header class="max-w-[1400px] mx-auto mb-16 flex flex-col items-center">
        <div class="relative group">
            <div class="absolute -inset-6 bg-blue-600 rounded-full blur-3xl opacity-20 group-hover:opacity-40 transition duration-1000"></div>
            <img src="logo.png" alt="Logo" class="relative main-logo">
        </div>
        <div class="flex items-center gap-2 mt-4">
            <span class="w-2 h-2 bg-blue-500 rounded-full animate-ping"></span>
            <span class="text-[10px] font-black tracking-[0.5em] text-blue-500 uppercase italic text-center">Neural Infiltration Aktiv</span>
        </div>
    </header>

    <div class="max-w-[1200px] mx-auto grid grid-cols-2 gap-4 mb-10">
        <div class="glass p-8 rounded-[2.5rem] text-center">
            <div id="stat-total" class="text-4xl font-black italic">0</div>
            <div class="text-[10px] text-gray-500 font-bold uppercase tracking-widest mt-2">Aktiva Objekt</div>
        </div>
        <div class="glass p-8 rounded-[2.5rem] text-center border-red-500/20">
            <div id="stat-panic" class="text-4xl font-black text-red-500 italic">0</div>
            <div class="text-[10px] text-red-500 font-bold uppercase tracking-widest mt-2">Panik-Deals</div>
        </div>
    </div>

    <section class="max-w-[1200px] mx-auto mb-12 space-y-4">
        <div class="glass p-2 rounded-[2.5rem] flex items-center px-8 border-white/10">
            <input type="text" id="searchInput" placeholder="Sök adress, stad eller mäklare..." 
                   class="bg-transparent w-full py-5 outline-none text-xl font-medium text-white placeholder:text-gray-800">
        </div>
        
        <div class="grid grid-cols-2 gap-4">
            <select id="filterType" class="glass p-6 rounded-3xl text-[11px] font-black uppercase text-white outline-none cursor-pointer border-none bg-transparent">
                <option value="all">Alla Objekt</option>
                <option value="panic">📉 Hög Panik</option>
                <option value="whale">🐋 Premium (>20M)</option>
            </select>
            <select id="sortOrder" class="glass p-6 rounded-3xl text-[11px] font-black uppercase text-white outline-none cursor-pointer border-none bg-transparent">
                <option value="dscore">Högst dScore</option>
                <option value="newest">Senast Inkommet</option>
                <option value="price-asc">Lägst Pris</option>
            </select>
        </div>
    </section>

    <main id="grid" class="max-w-[1200px] mx-auto grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
        <div class="col-span-full py-32 text-center text-gray-800 font-black text-xl uppercase italic tracking-widest">
            Väntar på marknadsinfiltration...
        </div>
    </main>

    <script>
        let db = [];

        // DIN NYA ASYNC FUNKTION MED CACHE-BRYTARE
        async function updateData() {
            try {
                // Tillsätt ett slumpmässigt nummer i slutet av URL:en för att lura cachen
                const response = await fetch('market-data.json?v=' + new Date().getTime());
                db = await response.json();
                render();
            } catch (err) {
                console.error("Infiltrationsfel:", err);
                // Grid-fallback vid fel
                if (db.length === 0) {
                    document.getElementById('grid').innerHTML = `
                        <div class="col-span-full py-32 text-center text-gray-800 font-black text-xl uppercase italic">
                            Synkroniserar Vault...
                        </div>`;
                }
            }
        }

        function render() {
            const grid = document.getElementById('grid');
            const search = document.getElementById('searchInput').value.toLowerCase();
            const filter = document.getElementById('filterType').value;
            const sort = document.getElementById('sortOrder').value;

            // SÄKER FILTRERING (Anti-NaN & Anti-Undefined)
            let data = db.filter(item => {
                const adress = (item.a || "").toLowerCase();
                const maklare = (item.s || "").toLowerCase();
                const matchSearch = adress.includes(search) || maklare.includes(search);
                
                if (filter === 'panic') return matchSearch && ((item.dScore || 0) > 75 || (item.pc || 0) > 0);
                if (filter === 'whale') return matchSearch && (item.p || 0) > 20000000;
                return matchSearch;
            });

            // SORTERING
            if (sort === 'dscore') data.sort((a, b) => (b.dScore || 0) - (a.dScore || 0));
            if (sort === 'newest') data.sort((a, b) => new Date(b.firstSeen || 0) - new Date(a.firstSeen || 0));
            if (sort === 'price-asc') data.sort((a, b) => (a.p || 0) - (b.p || 0));

            // UPPDATERA STATISTIK
            document.getElementById('stat-total').innerText = db.length;
            document.getElementById('stat-panic').innerText = db.filter(x => ((x.pc || 0) > 0 || (x.dScore || 0) > 75)).length;

            // RENDERING AV KORT
            if (data.length === 0) {
                grid.innerHTML = `<div class="col-span-full py-20 text-center text-gray-700 font-bold uppercase italic tracking-tighter">Inga objekt matchar sökningen.</div>`;
                return;
            }

            grid.innerHTML = data.map(item => {
                // FALLBACKS FÖR ALL DATA
                const adress = item.a || "Adress saknas";
                const maklare = item.s || "Privat";
                const dScore = Math.round(item.dScore || 0);
                const prisMkr = item.p ? (item.p / 1000000).toFixed(1) : "?";
                const kvadrat = item.area || "?";
                const rum = item.rooms || "?";
                const url = item.u || "#";
                const prissankning = item.pc || 0;

                return `
                    <div class="glass p-10 card flex flex-col justify-between ${dScore > 85 ? 'panic-mode' : ''}">
                        <div>
                            <div class="flex justify-between items-start mb-8">
                                <span class="text-[9px] font-black px-4 py-1.5 bg-white/5 rounded-full text-gray-500 uppercase italic tracking-widest border border-white/5">${maklare}</span>
                                <div class="text-right">
                                    <div class="text-[10px] font-black text-blue-500 uppercase tracking-widest">Index</div>
                                    <div class="text-3xl font-black text-white italic">${dScore}%</div>
                                </div>
                            </div>

                            <h2 class="text-3xl font-black text-white leading-[1.1] mb-2 uppercase italic tracking-tighter truncate">${adress}</h2>
                            <div class="text-gray-600 font-bold text-[11px] mb-10 uppercase tracking-[0.1em]">
                                ${rum} RUM • ${kvadrat} M²
                            </div>

                            <div class="mb-4">
                                <span class="text-5xl font-black text-white tracking-tighter">${prisMkr}</span>
                                <span class="text-gray-600 font-black text-xl uppercase italic">Mkr</span>
                            </div>

                            ${prissankning > 0 ? 
                                `<div class="text-red-500 font-black text-[11px] uppercase tracking-widest animate-pulse italic">📉 -${prissankning}% sänkt</div>` : 
                                `<div class="text-gray-800 font-black text-[9px] uppercase tracking-widest italic">Fast pris</div>`
                            }
                        </div>

                        <div class="mt-12">
                            <a href="${url}" target="_blank" class="block w-full bg-white text-black text-center font-black py-5 rounded-2xl hover:bg-blue-600 hover:text-white transition-all uppercase text-[11px] tracking-[0.3em]">
                                Öppna Objekt
                            </a>
                        </div>
                    </div>
                `;
            }).join('');
        }

        // Event Listeners
        document.getElementById('searchInput').addEventListener('input', render);
        document.getElementById('filterType').addEventListener('change', render);
        document.getElementById('sortOrder').addEventListener('change', render);

        // Starta loop
        updateData();
        setInterval(updateData, 60000); // Uppdatera 1 gång per minut
    </script>
</body>
</html>
