<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OMNI-BLACK // PRIVATE INDEX</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;600;900&family=Plus+Jakarta+Sans:wght@300;400;600&display=swap">
    <style>
        :root {
            --bg: #000000;
            --accent: #00ffa3; /* Hyper-Green */
            --accent-glow: rgba(0, 255, 163, 0.2);
            --surface: rgba(255, 255, 255, 0.03);
            --border: rgba(255, 255, 255, 0.07);
            --text-p: #888888;
            --text-h: #ffffff;
            --flip: #bcfe2b; /* Volt Yellow för Investering */
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-font-smoothing: antialiased; }
        body { 
            background: var(--bg); color: var(--text-h); 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            line-height: 1.6; overflow-x: hidden;
        }

        /* MESH BACKGROUND EFFECT */
        body::before {
            content: ""; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at 50% -20%, #111 0%, #000 100%);
            z-index: -1;
        }

        /* SIDE-BAR MINI-OS */
        .sidebar {
            position: fixed; left: 0; top: 0; bottom: 0; width: 80px;
            background: rgba(0,0,0,0.8); border-right: 1px solid var(--border);
            display: flex; flex-direction: column; align-items: center; padding: 30px 0;
            backdrop-filter: blur(20px); z-index: 100; transition: width 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .sidebar:hover { width: 240px; }
        .sidebar:hover .nav-label { opacity: 1; pointer-events: auto; }

        .nav-item { 
            width: 100%; padding: 20px; display: flex; align-items: center; 
            color: var(--text-p); text-decoration: none; transition: 0.2s; position: relative;
        }
        .nav-item:hover { color: var(--accent); background: rgba(255,255,255,0.02); }
        .nav-icon { min-width: 40px; font-size: 1.2rem; text-align: center; }
        .nav-label { opacity: 0; pointer-events: none; white-space: nowrap; margin-left: 15px; font-weight: 600; font-size: 0.85rem; }

        /* CONTENT AREA */
        .main-stage { margin-left: 80px; padding: 60px 80px; transition: margin-left 0.3s; }

        /* TYPOGRAPHY */
        .hero-title { font-family: 'Outfit', sans-serif; font-size: 4rem; font-weight: 900; letter-spacing: -3px; line-height: 1; margin-bottom: 40px; }
        .hero-title span { color: var(--accent); }

        /* TACTICAL SEARCH */
        .search-bar {
            width: 100%; max-width: 600px; background: var(--surface); border: 1px solid var(--border);
            padding: 18px 30px; border-radius: 12px; color: #fff; font-size: 1rem;
            outline: none; transition: 0.3s; margin-bottom: 60px;
        }
        .search-bar:focus { border-color: var(--accent); box-shadow: 0 0 30px var(--accent-glow); }

        /* DATA GRID */
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(380px, 1fr)); gap: 40px; }

        /* ELITE CARD DESIGN */
        .card {
            text-decoration: none; color: inherit; position: relative;
            background: transparent; transition: 0.4s;
        }
        .card::before {
            content: ""; position: absolute; inset: 0; background: var(--surface);
            border: 1px solid var(--border); border-radius: 24px; z-index: -1; transition: 0.4s;
        }
        .card:hover::before { transform: scale(1.02); background: rgba(255,255,255,0.05); border-color: rgba(255,255,255,0.2); }

        .card-img { width: 100%; height: 240px; background: #111; border-radius: 20px; overflow: hidden; margin-bottom: 20px; }
        .card-img div { width: 100%; height: 100%; background: linear-gradient(45deg, #0a0a0a, #1a1a1a); position: relative; }
        
        .card-content { padding: 0 10px 25px 10px; }
        .card-tag { 
            font-size: 0.65rem; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; 
            color: var(--accent); margin-bottom: 12px; display: block;
        }
        .card-title { font-family: 'Outfit', sans-serif; font-size: 1.6rem; font-weight: 600; margin-bottom: 5px; }
        .card-meta { color: var(--text-p); font-size: 0.85rem; margin-bottom: 20px; }

        .price-wrap { display: flex; align-items: baseline; gap: 12px; }
        .price-main { font-size: 1.8rem; font-weight: 600; color: #fff; }
        .price-info { color: var(--flip); font-weight: 700; font-size: 0.9rem; }

        /* FLOATING ACTION BUTTON */
        .fab {
            position: fixed; bottom: 40px; right: 40px; background: var(--accent);
            color: #000; width: 60px; height: 60px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 10px 30px var(--accent-glow); cursor: pointer; transition: 0.3s;
        }
        .fab:hover { transform: scale(1.1) rotate(90deg); }

        /* RESPONSIVE */
        @media (max-width: 768px) {
            .sidebar { width: 0; display: none; }
            .main-stage { margin-left: 0; padding: 40px 20px; }
            .hero-title { font-size: 2.5rem; }
        }
    </style>
</head>
<body>

<div class="sidebar">
    <a href="#" class="nav-item" onclick="setFilter('ALL')"><span class="nav-icon">▤</span><span class="nav-label">MARKNADEN</span></a>
    <a href="#" class="nav-item" onclick="setFilter('FLIP')"><span class="nav-icon">⚡</span><span class="nav-label">FLIP_ALGORITM</span></a>
    <a href="#" class="nav-item" onclick="setFilter('WHALE')"><span class="nav-icon">🐋</span><span class="nav-label">WHALE_WATCH</span></a>
    <a href="#" class="nav-item" onclick="setFilter('DESP')"><span class="nav-icon">⚠️</span><span class="nav-label">DESPERATION</span></a>
</div>

<div class="main-stage">
    <h1 class="hero-title">PRIVATE<span>INDEX</span>.</h1>
    
    <input type="text" id="search" class="search-bar" placeholder="SÖK_SYSTEM_QUERY...">

    <div class="grid" id="mainGrid">
        </div>
</div>

<div class="fab" onclick="window.scrollTo({top: 0, behavior: 'smooth'})">＋</div>

<script>
    let db = [];
    let filter = 'ALL';

    async function load() {
        const r = await fetch('market-data.json?v=' + Date.now());
        db = await r.json();
        render();
    }

    function setFilter(f) { filter = f; render(); }

    function render() {
        const query = document.getElementById('search').value.toLowerCase();
        let list = db;

        if(filter === 'FLIP') list = db.filter(x => x.flip?.isHotFlip);
        if(filter === 'WHALE') list = db.filter(x => x.isWhale);
        if(filter === 'DESP') list = db.filter(x => x.dScore > 75);

        if(query) list = list.filter(x => x.a.toLowerCase().includes(query));

        document.getElementById('mainGrid').innerHTML = list.slice(0, 80).map((h, i) => `
            <a href="${h.u}" target="_blank" class="card">
                <div class="card-img"><div></div></div>
                <div class="card-content">
                    <span class="card-tag">${h.isWhale ? 'Whale Class' : h.flip?.isHotFlip ? 'Alpha Deal' : h.s}</span>
                    <div class="card-title">${h.a.split(',')[0]}</div>
                    <div class="card-meta">${h.a.split(',')[1] || 'Sverige'} • ${h.area || '--'} m²</div>
                    <div class="price-wrap">
                        <div class="price-main">${(h.p/1000000).toFixed(2)}M</div>
                        ${h.streetDiff < 0 ? `<div class="price-info">${h.streetDiff}% VS GATA</div>` : ''}
                    </div>
                </div>
            </a>
        `).join('');
    }

    document.getElementById('search').addEventListener('input', render);
    load();
</script>

</body>
</html>
