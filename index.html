<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>ALLABOSTÄDER | The Sovereign Singularity</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;900&family=Inter:wght@300;400;700;900&display=swap">
    <style>
        :root {
            --neon-green: #00ff88; --luxury-gold: #ffcc00; --danger-red: #ff4444;
            --deep-black: #050505; --card-bg: #0a0a0a; --glass: rgba(255, 255, 255, 0.03);
        }

        body {
            background: var(--deep-black); color: #fff; font-family: 'Inter', sans-serif;
            margin: 0; overflow-x: hidden; -webkit-tap-highlight-color: transparent;
        }

        /* --- LOGO AURA & NEURAL HEADER --- */
        header {
            padding: 60px 0; text-align: center; background: radial-gradient(circle at center, #111 0%, #050505 100%);
            position: relative; border-bottom: 1px solid #151515;
        }

        .logo-container { position: relative; display: inline-block; padding: 25px; }
        .main-logo {
            font-family: 'Orbitron'; font-size: 3.5rem; font-weight: 900; letter-spacing: -3px; margin: 0;
            position: relative; z-index: 10; text-transform: uppercase;
        }
        .main-logo span { color: var(--neon-green); text-shadow: 0 0 30px rgba(0,255,136,0.6); }

        .logo-aura {
            position: absolute; inset: 0; border: 2px solid var(--neon-green); border-radius: 20px;
            animation: rotateAura 6s linear infinite; box-shadow: 0 0 50px rgba(0,255,136,0.2);
        }
        @keyframes rotateAura {
            0% { transform: rotate(0deg); border-radius: 20px; }
            50% { transform: rotate(180deg); border-radius: 50px; border-color: var(--luxury-gold); }
            100% { transform: rotate(360deg); border-radius: 20px; }
        }

        /* --- CONTROL INTERFACE --- */
        .control-vault {
            max-width: 1000px; margin: -40px auto 40px; position: relative; z-index: 100; padding: 0 20px;
        }
        .search-bar {
            width: 100%; background: #1a1a1a; border: 2px solid #333; padding: 25px 35px;
            border-radius: 100px; color: var(--neon-green); font-size: 1.4rem; font-weight: 800;
            outline: none; transition: 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 20px 60px rgba(0,0,0,0.8);
        }
        .search-bar:focus { border-color: var(--neon-green); transform: scale(1.03); box-shadow: 0 0 40px rgba(0, 255, 136, 0.2); }

        /* --- GRID & CARDS --- */
        .matrix-grid {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(380px, 1fr));
            gap: 30px; padding: 40px; max-width: 1600px; margin: 0 auto;
        }

        .unit-card {
            background: var(--card-bg); border-radius: 28px; border: 1px solid #1a1a1a;
            overflow: hidden; transition: 0.4s cubic-bezier(0.165, 0.84, 0.44, 1); position: relative;
        }
        .unit-card:hover { transform: translateY(-12px); border-color: #333; box-shadow: 0 30px 60px rgba(0,0,0,0.5); }

        /* --- HUD METERS (Top of Card) --- */
        .card-hud {
            display: grid; grid-template-columns: 1fr 1fr 1fr; background: rgba(0,0,0,0.4);
            padding: 15px; border-bottom: 1px solid #1a1a1a; backdrop-filter: blur(10px);
        }
        .hud-item { text-align: center; }
        .hud-val { display: block; font-size: 1.2rem; font-weight: 900; font-family: 'Orbitron'; }
        .hud-label { font-size: 0.6rem; color: #666; text-transform: uppercase; letter-spacing: 1px; }

        .v-idx { color: var(--neon-green); }
        .s-idx { color: var(--danger-red); }
        .l-idx { color: var(--luxury-gold); }

        /* --- CONTENT --- */
        .card-body { padding: 25px; }
        .price-tag { font-size: 2.4rem; font-weight: 900; letter-spacing: -2px; color: #fff; margin-bottom: 5px; }
        .price-diff { color: var(--danger-red); font-size: 0.9rem; font-weight: 700; margin-left: 10px; }
        .address-text { font-size: 1.1rem; color: #888; margin-bottom: 20px; font-weight: 500; }

        /* --- TAGS --- */
        .tag-cloud { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 20px; }
        .tag {
            padding: 6px 12px; border-radius: 8px; font-size: 0.7rem; font-weight: 800;
            background: #151515; border: 1px solid #222; text-transform: uppercase;
        }
        .tag-risk { color: var(--danger-red); border-color: rgba(255,68,68,0.2); background: rgba(255,68,68,0.05); }
        .tag-gold { color: var(--luxury-gold); border-color: rgba(255,204,0,0.2); }

        /* --- ACTION --- */
        .btn-infiltrate {
            width: 100%; padding: 18px; background: transparent; border: 1px solid var(--neon-green);
            color: var(--neon-green); border-radius: 15px; font-family: 'Orbitron'; font-weight: 900;
            cursor: pointer; transition: 0.3s; letter-spacing: 2px; font-size: 0.8rem;
        }
        .btn-infiltrate:hover { background: var(--neon-green); color: #000; box-shadow: 0 0 30px var(--neon-green); }

        /* --- SKELETON ANIMATION --- */
        .shimmer { background: linear-gradient(90deg, #0a0a0a 25%, #151515 50%, #0a0a0a 75%); background-size: 200% 100%; animation: loading 1.5s infinite; }
        @keyframes loading { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
    </style>
</head>
<body>

<header>
    <div class="logo-container">
        <div class="logo-aura"></div>
        <h1 class="main-logo">ALLA<span>BOSTÄDER</span></h1>
    </div>
</header>

<div class="control-vault">
    <input type="text" id="master-search" class="search-bar" placeholder="SÖK I MATRIX (EX. 'POOLVILLA SOLLENTUNA')...">
</div>

<div class="matrix-grid" id="main-grid">
    </div>

<script>
    const SovereignMatrix = {
        vault: [],
        
        async init() {
            const grid = document.getElementById('main-grid');
            // Initiera med 8 skeletons
            grid.innerHTML = Array(8).fill('<div class="unit-card shimmer" style="height:450px"></div>').join('');
            
            try {
                const res = await fetch('market-data.json');
                this.vault = await res.json();
                this.render();
            } catch (e) {
                grid.innerHTML = `<div style="grid-column: 1/-1; text-align:center; color:gray;">SYSTEM OFFLINE: VÄNTAR PÅ DATAINFILTRATION...</div>`;
            }

            document.getElementById('master-search').addEventListener('input', (e) => this.render(e.target.value));
        },

        render(filter = '') {
            const grid = document.getElementById('main-grid');
            const term = filter.toLowerCase();
            
            const filtered = this.vault.filter(u => 
                u.a.toLowerCase().includes(term) || u.s.toLowerCase().includes(term) || (u.d && u.d.toLowerCase().includes(term))
            ).slice(0, 100);

            grid.innerHTML = filtered.map(u => `
                <div class="unit-card">
                    <div class="card-hud">
                        <div class="hud-item">
                            <span class="hud-val v-idx">${u.vIndex || 0}%</span>
                            <span class="hud-label">Värde</span>
                        </div>
                        <div class="hud-item">
                            <span class="hud-val s-idx">${u.sIndex || 0}%</span>
                            <span class="hud-label">Trygghet</span>
                        </div>
                        <div class="hud-item">
                            <span class="hud-val l-idx">${u.lIndex || 0}%</span>
                            <span class="hud-label">Lyx</span>
                        </div>
                    </div>
                    
                    <div class="card-body">
                        <div class="price-tag">
                            ${(u.p / 1000000).toFixed(1)}<span style="font-size:1.2rem; color:var(--neon-green)">M</span>
                            ${u.pc ? `<span class="price-diff">-${u.pc}%</span>` : ''}
                        </div>
                        <div class="address-text">${u.a}</div>
                        
                        <div class="tag-cloud">
                            <div class="tag">${u.area || '?'} m²</div>
                            <div class="tag">${u.rooms || '?'} RUM</div>
                            ${u.hasRadon ? '<div class="tag tag-risk">⚠️ RISK: RADON</div>' : ''}
                            ${u.hasPool ? '<div class="tag tag-gold">🏊 POOL</div>' : ''}
                            ${u.lIndex > 80 ? '<div class="tag tag-gold">💎 ELIT-OBJEKT</div>' : ''}
                        </div>

                        <button class="btn-infiltrate" onclick="window.open('${u.u}', '_blank')">INFILTRERA KÄLLAN</button>
                    </div>
                </div>
            `).join('');
        }
    };

    window.onload = () => SovereignMatrix.init();
</script>

</body>
</html>
