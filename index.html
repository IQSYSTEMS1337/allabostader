<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SOVEREIGN // TERMINAL</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root { --blue: #3b82f6; --red: #ef4444; --bg: #050505; }
        body { 
            background: var(--bg); 
            color: #fff; 
            font-family: 'Inter', sans-serif; 
            letter-spacing: -0.02em;
            -webkit-tap-highlight-color: transparent;
        }
        .glass { background: rgba(20, 20, 20, 0.8); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.05); }
        .card { transition: transform 0.2s active; border-radius: 2rem; overflow: hidden; }
        .card:active { transform: scale(0.97); }
        .panic-border { border: 1px solid rgba(239, 68, 68, 0.4); box-shadow: 0 0 20px rgba(239, 68, 68, 0.1); }
        
        /* Mobil-anpassad scroll */
        .hide-scroll::-webkit-scrollbar { display: none; }
        
        /* Logo glöd */
        .logo-glow { filter: drop-shadow(0 0 10px rgba(59, 130, 246, 0.5)); }
        
        /* Bottom Sheet för filter på mobil */
        @media (max-width: 768px) {
            .mobile-filter { position: sticky; bottom: 1rem; z-index: 50; margin-top: 2rem; }
        }
    </style>
</head>
<body class="p-4 md:p-12 pb-24">

    <header class="max-w-[1400px] mx-auto mb-10 flex flex-col items-center text-center space-y-4">
        <div class="relative">
            <div class="absolute -inset-2 bg-blue-600 rounded-full blur-xl opacity-20"></div>
            <img src="logo.png" alt="Logo" class="relative w-24 h-24 object-contain logo-glow rounded-full glass p-3 border-white/10">
        </div>
        <div>
            <div class="flex items-center justify-center gap-2 mb-1">
                <span class="w-2 h-2 bg-blue-500 rounded-full animate-pulse"></span>
                <span class="text-[10px] font-black tracking-[0.3em] text-blue-500 uppercase">System Aktivt // Autonom Infiltration</span>
            </div>
            <h1 class="text-5xl font-black tracking-tighter italic uppercase">Sovereign<span class="text-blue-600">.</span></h1>
        </div>
    </header>

    <div class="max-w-[1400px] mx-auto grid grid-cols-2 gap-4 mb-8">
        <div class="glass p-6 rounded-3xl text-center">
            <div id="count-total" class="text-3xl font-black italic">0</div>
            <div class="text-[9px] text-gray-500 font-bold uppercase tracking-widest mt-1">Bevakade Objekt</div>
        </div>
        <div class="glass p-6 rounded-3xl text-center border-red-500/20">
            <div id="count-panic" class="text-3xl font-black text-red-500 italic">0</div>
            <div class="text-[9px] text-red-500 font-bold uppercase tracking-widest mt-1">Panik-Möjligheter</div>
        </div>
    </div>

    <section class="max-w-[1400px] mx-auto mb-10 space-y-4">
        <div class="glass p-2 rounded-[2rem] flex items-center px-6">
            <input type="text" id="search" placeholder="Sök adress eller område..." 
                   class="bg-transparent w-full py-4 outline-none text-lg font-medium text-white placeholder:text-gray-700">
        </div>
        
        <div class="grid grid-cols-2 gap-3 mobile-filter">
            <select id="filter" class="glass p-5 rounded-2xl text-[11px] font-black uppercase text-white outline-none appearance-none text-center">
                <option value="all">Alla Objekt</option>
                <option value="distressed">📉 Panik-Score</option>
                <option value="whale">🐋 Whale (>20M)</option>
            </select>
            <select id="sort" class="glass p-5 rounded-2xl text-[11px] font-black uppercase text-white outline-none appearance-none text-center">
                <option value="dscore">Högst dScore</option>
                <option value="newest">Senast Inkommet</option>
                <option value="price-asc">Lägst Pris</option>
            </select>
        </div>
    </section>

    <main id="mainGrid" class="max-w-[1400px] mx-auto grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
        </main>

    <script>
        let rawData = [];

        async function updateVault() {
            try {
                const res = await fetch('market-data.json');
                rawData = await res.json();
                render();
            } catch (e) {
                document.getElementById('mainGrid').innerHTML = `<div class="col-span-full py-20 text-center text-gray-700 font-bold uppercase tracking-tighter">Väntar på dataström...</div>`;
            }
        }

        function render() {
            const grid = document.getElementById('mainGrid');
            const search = document.getElementById('search').value.toLowerCase();
            const filter = document.getElementById('filter').value;
            const sort = document.getElementById('sort').value;

            let filtered = [...rawData];

            if (search) filtered = filtered.filter(x => x.a.toLowerCase().includes(search) || x.s.toLowerCase().includes(search));
            if (filter === 'distressed') filtered = filtered.filter(x => x.pc > 0 || x.dScore > 75);
            if (filter === 'whale') filtered = filtered.filter(x => x.p > 20000000);

            if (sort === 'dscore') filtered.sort((a,b) => b.dScore - a.dScore);
            if (sort === 'newest') filtered.sort((a,b) => new Date(b.firstSeen) - new Date(a.firstSeen));
            if (sort === 'price-asc') filtered.sort((a,b) => a.p - b.p);

            document.getElementById('count-total').innerText = rawData.length;
            document.getElementById('count-panic').innerText = rawData.filter(x => x.pc > 0).length;

            grid.innerHTML = filtered.map(item => `
                <div class="glass p-8 card flex flex-col justify-between ${item.dScore > 85 ? 'panic-border' : ''}">
                    <div>
                        <div class="flex justify-between items-start mb-6">
                            <span class="text-[9px] font-black px-3 py-1 bg-white/5 rounded-full text-gray-500 uppercase tracking-widest">${item.s || 'MÄKLARE'}</span>
                            <div class="text-right">
                                <div class="text-[10px] font-black text-blue-500 uppercase tracking-widest">dScore</div>
                                <div class="text-2xl font-black text-white italic">${item.dScore}%</div>
                            </div>
                        </div>

                        <h2 class="text-2xl font-black text-white leading-tight mb-1 uppercase italic truncate">${item.a}</h2>
                        <div class="text-gray-500 font-bold text-[10px] mb-8 uppercase tracking-widest">
                            ${item.rooms || '?'} ROK // ${item.area || '?'} M²
                        </div>

                        <div class="mb-4">
                            <span class="text-5xl font-black text-white tracking-tighter">${(item.p / 1000000).toFixed(1)}</span>
                            <span class="text-gray-600 font-black text-xl uppercase italic">Mkr</span>
                        </div>

                        ${item.pc > 0 ? `
                            <div class="text-red-500 font-black text-[11px] uppercase tracking-widest animate-pulse">
                                📉 -${item.pc}% | Sänkt ${( (item.pHistory[0].p - item.p) / 1000).toFixed(0)}k
                            </div>
                        ` : `
                            <div class="text-emerald-500 font-black text-[9px] uppercase tracking-widest italic">Marknadsvärde Stabiliserat</div>
                        `}
                    </div>

                    <div class="mt-10">
                        <a href="${item.u}" target="_blank" class="block w-full bg-white text-black text-center font-black py-5 rounded-2xl hover:bg-blue-600 hover:text-white transition-all uppercase text-[11px] tracking-[0.2em]">
                            Öppna Objekt
                        </a>
                    </div>
                </div>
            `).join('');
        }

        document.getElementById('search').addEventListener('input', render);
        document.getElementById('filter').addEventListener('change', render);
        document.getElementById('sort').addEventListener('change', render);

        updateVault();
        setInterval(updateVault, 60000);
    </script>
</body>
</html>
