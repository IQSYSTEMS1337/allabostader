<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    
    <meta name="referrer" content="no-referrer">
    
    <title>AllaBostäder | Hela Sveriges bostadsmarknad på ett ställe</title>
    <meta name="description" content="Sök bland Sveriges alla villor, lägenheter och tomter. Få oberoende marknadsdata, exakta priser och drönarvyer från över 6000 orter. Helt gratis.">
    <meta name="theme-color" content="#ffffff">

    <meta property="og:title" content="AllaBostäder | Hela Sveriges bostadsmarknad">
    <meta property="og:description" content="Sök bland Sveriges alla bostäder. Få oberoende marknadsdata och exakta priser.">
    <meta property="og:image" content="https://allabostader.se/logo.jpg">
    <meta property="og:url" content="https://allabostader.se/">
    <meta property="og:type" content="website">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    <script id="seo-schema" type="application/ld+json">{}</script>

    <style>
        /* --- NORDIC ULTRA-PREMIUM VARIABLES --- */
        :root {
            --bg-page: #F8FAFC;
            --surface-card: #FFFFFF;
            --text-main: #0F172A;
            --text-muted: #64748B;
            --accent-dark: #020617; 
            --accent-brand: #2563EB; 
            --accent-glow: rgba(37, 99, 235, 0.4);
            --border-light: #E2E8F0;
            
            --tag-success-bg: #ECFDF5;
            --tag-success-txt: #047857;
            --tag-alert-bg: #FEF2F2;
            --tag-alert-txt: #B91C1C;
            
            --shadow-float: 0 20px 40px -15px rgba(0, 0, 0, 0.08);
            --shadow-hover: 0 25px 50px -12px rgba(0, 0, 0, 0.15);
            --radius-card: 20px;
            --radius-btn: 12px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; -webkit-font-smoothing: antialiased; }
        body { background-color: var(--bg-page); color: var(--text-main); overflow-x: hidden; scroll-behavior: smooth; }

        /* --- THE APEX NAVBAR --- */
        .navbar {
            background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(25px); -webkit-backdrop-filter: blur(25px);
            border-bottom: 1px solid rgba(226, 232, 240, 0.5); padding: 12px 5vw;
            display: flex; justify-content: space-between; align-items: center;
            position: sticky; top: 0; z-index: 2000;
        }
        
        .logo-container {
            display: flex; align-items: center; justify-content: center;
            background: #FFFFFF; padding: 5px 10px; border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05); transition: transform 0.3s ease;
        }
        .logo-container:hover { transform: scale(1.05); }
        .logo { max-height: 80px; width: auto; object-fit: contain; }
        
        .market-status {
            display: flex; align-items: center; gap: 12px; background: var(--bg-page);
            padding: 10px 18px; border-radius: 100px; border: 1px solid var(--border-light);
            font-size: 0.85rem; font-weight: 700; color: var(--text-muted);
        }
        .status-dot { width: 8px; height: 8px; background: #10B981; border-radius: 50%; box-shadow: 0 0 12px #10B981; animation: pulse 2s infinite; }
        @keyframes pulse { 0% { transform: scale(0.95); opacity: 0.7; } 70% { transform: scale(1.1); opacity: 1; } 100% { transform: scale(0.95); opacity: 0.7; } }
        
        .nav-btn {
            background: var(--accent-dark); color: #fff; padding: 14px 32px; border-radius: 100px;
            font-weight: 700; border: none; cursor: pointer; transition: all 0.3s; box-shadow: 0 4px 15px rgba(2, 6, 23, 0.2);
        }
        .nav-btn:hover { background: var(--accent-brand); transform: translateY(-3px); box-shadow: 0 10px 25px var(--accent-glow); }

        /* --- HERO SEKTION --- */
        .hero { position: relative; background: #FFFFFF; padding: 120px 20px 100px; text-align: center; overflow: hidden; border-bottom: 1px solid var(--border-light); }
        
        .aurora-1, .aurora-2, .aurora-3 { position: absolute; border-radius: 50%; filter: blur(80px); opacity: 0.4; z-index: 0; animation: float 20s infinite alternate ease-in-out; }
        .aurora-1 { background: #3B82F6; width: 40vw; height: 40vw; top: -10%; left: -10%; }
        .aurora-2 { background: #10B981; width: 35vw; height: 35vw; bottom: -20%; right: -5%; animation-delay: -5s; }
        .aurora-3 { background: #8B5CF6; width: 30vw; height: 30vw; top: 40%; left: 40%; animation-delay: -10s; opacity: 0.2; }

        @keyframes float { 0% { transform: translate(0, 0) scale(1); } 50% { transform: translate(5%, 10%) scale(1.1); } 100% { transform: translate(-5%, -5%) scale(0.95); } }
        
        .hero-content { position: relative; z-index: 10; max-width: 1000px; margin: 0 auto; }
        
        .live-stats {
            display: inline-flex; align-items: center; gap: 10px; background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(10px);
            padding: 10px 24px; border-radius: 100px; font-size: 1rem; font-weight: 800; color: var(--text-main); margin-bottom: 30px;
            border: 1px solid rgba(226, 232, 240, 0.8); box-shadow: 0 10px 25px rgba(0,0,0,0.05);
        }

        .hero h1 { font-size: clamp(2.8rem, 6vw, 5rem); font-weight: 900; letter-spacing: -0.04em; margin-bottom: 25px; line-height: 1.05; color: var(--accent-dark); }
        .hero h1 span { background: linear-gradient(135deg, var(--accent-brand), #8B5CF6); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .hero p { font-size: clamp(1.15rem, 2vw, 1.35rem); color: var(--text-muted); font-weight: 500; max-width: 650px; margin: 0 auto; line-height: 1.6; }

        /* --- SÖKMOTOR --- */
        .search-engine {
            background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(20px); border: 1px solid var(--border-light);
            border-radius: 100px; padding: 12px; display: flex; align-items: center; box-shadow: var(--shadow-float);
            max-width: 900px; margin: 40px auto 0; transition: all 0.3s ease; position: relative;
        }
        .search-engine:focus-within { box-shadow: 0 0 0 5px var(--accent-glow); border-color: var(--accent-brand); transform: scale(1.01); }

        .search-icon { padding: 0 24px; color: var(--accent-brand); display: flex; align-items: center; }
        .main-search-input { flex-grow: 1; border: none; outline: none; font-size: 1.25rem; font-weight: 600; color: var(--accent-dark); background: transparent; padding: 18px 0; width: 100%; }

        .filter-toggle {
            background: var(--accent-dark); border: none; padding: 18px 32px; border-radius: 100px;
            font-weight: 800; color: #fff; cursor: pointer; transition: 0.2s; display: flex; align-items: center; gap: 10px;
        }

        .ac-box { position: absolute; top: calc(100% + 15px); left: 0; right: 0; background: #fff; border: 1px solid var(--border-light); border-radius: var(--radius-card); box-shadow: var(--shadow-hover); overflow: hidden; display: none; z-index: 1000; text-align: left; }
        .ac-item { padding: 18px 24px; font-weight: 600; cursor: pointer; border-bottom: 1px solid var(--bg-page); transition: 0.2s; font-size: 1.05rem; }
        .ac-item:hover { background: var(--bg-page); color: var(--accent-brand); padding-left: 32px; }

        .filter-matrix { max-width: 1000px; margin: 30px auto 0; display: none; background: #fff; border-radius: var(--radius-card); border: 1px solid var(--border-light); box-shadow: var(--shadow-float); padding: 30px; text-align: left; animation: slideDown 0.4s forwards; z-index: 50; position: relative; }
        @keyframes slideDown { from { opacity: 0; transform: translateY(-15px); } to { opacity: 1; transform: translateY(0); } }
        
        .filter-group-title { font-size: 0.85rem; text-transform: uppercase; letter-spacing: 1px; font-weight: 800; color: var(--text-muted); margin-bottom: 15px; margin-top: 25px; border-bottom: 1px solid var(--border-light); padding-bottom: 8px; }
        .filter-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; }
        .f-select, .f-input { width: 100%; padding: 16px; border-radius: var(--radius-btn); border: 1px solid var(--border-light); font-size: 0.95rem; font-weight: 600; color: var(--accent-dark); background-color: var(--bg-page); outline: none; }

        .checkbox-row { display: flex; flex-wrap: wrap; gap: 15px; margin-top: 15px; }
        .cb-label { display: flex; align-items: center; gap: 8px; font-size: 0.95rem; font-weight: 600; cursor: pointer; color: var(--accent-dark); padding: 10px 15px; border: 1px solid var(--border-light); border-radius: var(--radius-btn); transition: 0.2s; }
        .cb-label:hover { border-color: var(--accent-brand); background: #F1F5F9; }

        /* --- THE GRID & CARDS --- */
        .feed { max-width: 1500px; margin: 60px auto 100px; padding: 0 5vw; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(380px, 1fr)); gap: 40px; }

        .card { background: var(--surface-card); border-radius: var(--radius-card); overflow: hidden; text-decoration: none; color: inherit; display: flex; flex-direction: column; border: 1px solid var(--border-light); position: relative; transition: all 0.4s; opacity: 0; transform: translateY(30px); animation: cardEntrance 0.6s forwards; }
        @keyframes cardEntrance { to { opacity: 1; transform: translateY(0); } }
        .card:hover { transform: translateY(-10px); box-shadow: var(--shadow-hover); }

        .c-media { position: relative; width: 100%; aspect-ratio: 4/3; background: #E2E8F0; overflow: hidden; }
        .c-img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.8s ease; }
        
        .c-map { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none; opacity: 0; pointer-events: none; transition: opacity 0.4s; z-index: 5; background: #E2E8F0; }
        .card.is-map .c-map { opacity: 1; pointer-events: all; }

        .c-controls { position: absolute; top: 16px; left: 16px; right: 16px; display: flex; justify-content: space-between; align-items: flex-start; z-index: 10; pointer-events: none; }
        .c-badges { display: flex; flex-direction: column; gap: 8px; pointer-events: auto; }
        .c-badge { padding: 8px 14px; border-radius: 100px; font-size: 0.75rem; font-weight: 800; text-transform: uppercase; background: #fff; box-shadow: 0 4px 15px rgba(0,0,0,0.08); border: 1px solid var(--border-light); }
        .cb-new { background: var(--tag-success-bg); color: var(--tag-success-txt); }
        .cb-drop { background: var(--tag-alert-bg); color: var(--tag-alert-txt); }

        .btn-map { pointer-events: auto; background: rgba(255,255,255,0.95); backdrop-filter: blur(10px); border: none; padding: 12px 20px; border-radius: 100px; font-weight: 800; font-size: 0.85rem; color: var(--accent-dark); cursor: pointer; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }

        .c-data { padding: 24px; display: flex; flex-direction: column; flex-grow: 1; }
        .c-price-box { display: flex; align-items: baseline; gap: 12px; margin-bottom: 8px; }
        .c-price { font-size: 1.85rem; font-weight: 900; color: var(--accent-dark); }
        .c-old { font-size: 1.1rem; color: var(--text-muted); text-decoration: line-through; }
        
        .c-addr { font-size: 1.3rem; font-weight: 800; margin-bottom: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .c-loc { font-size: 1.05rem; color: var(--text-muted); margin-bottom: 24px; font-weight: 500; }

        .c-specs { display: flex; flex-wrap: wrap; gap: 16px; border-top: 1px solid var(--border-light); padding-top: 20px; margin-top: auto; }
        .spec-item { display: flex; flex-direction: column; gap: 2px; }
        .s-lbl { font-size: 0.75rem; text-transform: uppercase; font-weight: 800; color: var(--text-muted); }
        .s-val { font-size: 1.05rem; font-weight: 700; color: var(--accent-dark); }

        @media (max-width: 768px) {
            .navbar { padding: 12px 20px; }
            .hero h1 { font-size: 2.8rem; }
            .search-engine { border-radius: var(--radius-btn); padding: 8px; flex-direction: column; }
            .grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

<nav class="navbar">
    <div class="logo-container">
        <a href="/">
            <img src="logo.jpg" alt="AllaBostäder" class="logo" onerror="this.src='logo.png'">
        </a>
    </div>
    <div style="display: flex; gap: 20px; align-items: center;">
        <div class="market-status">
            <div class="status-dot"></div><span>Marknadstäckning: 100%</span>
        </div>
        <button class="nav-btn" onclick="App.toggleFavs(event)">Sparade Objekt</button>
    </div>
</nav>

<header class="hero">
    <div class="aurora-1"></div><div class="aurora-2"></div><div class="aurora-3"></div>
    <div class="hero-content">
        <div class="live-stats">
            LIVE: <span class="counter-number" id="liveCounter">0</span> objekt indexerade
        </div>
        <h1>Hela Sveriges utbud.<br><span>Slipp leta överallt.</span></h1>
        <p>Vi samlar allt från alla mäklare i realtid. Exakta priser, Street View-vyer och total transparens.</p>
        
        <div class="search-engine">
            <div class="search-icon">
                <svg width="28" height="28" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
            </div>
            <input type="text" id="searchInput" class="main-search-input" placeholder="Sök ort, adresser eller kommuner..." autocomplete="off">
            <button class="filter-toggle" onclick="document.getElementById('advFilters').style.display = document.getElementById('advFilters').style.display === 'block' ? 'none' : 'block'">Fler filter</button>
            <div id="autocompleteList" class="ac-box"></div>
        </div>

        <div id="advFilters" class="filter-matrix">
            <div class="filter-group-title">Marknadsfilter</div>
            <div class="filter-row">
                <select id="typeSelect" class="f-select">
                    <option value="">Alla bostadstyper</option>
                    <option value="Villa">Villor & Radhus</option>
                    <option value="Lägenhet">Lägenheter</option>
                </select>
                <select id="minPriceSelect" class="f-select"><option value="">Lägsta pris</option></select>
                <select id="maxPriceSelect" class="f-select"><option value="">Högsta pris</option></select>
            </div>
            <div class="checkbox-row">
                <label class="cb-label"><input type="checkbox" id="cb-stress"> Prissänkta objekt</label>
                <label class="cb-label"><input type="checkbox" id="cb-blabetong"> Uteslut 60/70-tal (Radon-risk)</label>
            </div>
        </div>
    </div>
</header>

<main class="feed">
    <div class="grid" id="propertyGrid"></div>
</main>

<script>
    const App = {
        data: [],
        locations: [],
        currentQuery: "",
        viewingFavs: false,
        favorites: JSON.parse(localStorage.getItem('ab_empire_favs') || '[]'),
        
        async init() {
            try {
                const [marketRes, aiorterRes] = await Promise.all([
                    fetch('market-data.json').then(r => r.json()),
                    fetch('Aiorter.csv').then(r => r.text())
                ]);
                this.data = marketRes;
                this.locations = aiorterRes.split('\n').slice(1).map(r => r.split(';')[0].replace(/"/g, '').trim()).filter(Boolean);
                this.setupEvents();
                this.renderFeed();
            } catch (e) { console.error("System offline", e); }
        },

        setupEvents() {
            const input = document.getElementById('searchInput');
            input.addEventListener('input', (e) => {
                this.currentQuery = e.target.value;
                this.renderFeed();
            });
        },

        toggleFavs(e) {
            this.viewingFavs = !this.viewingFavs;
            e.target.innerText = this.viewingFavs ? "Visa Alla" : "Sparade Objekt";
            this.renderFeed();
        },

        toggleMap(e, btn, address) {
            e.preventDefault();
            const card = btn.closest('.card');
            const iframe = card.querySelector('.c-map');
            if (card.classList.contains('is-map')) {
                card.classList.remove('is-map');
                btn.innerHTML = '🗺️ Drönarvy';
            } else {
                if (!iframe.src) {
                    // FIX: Korrekt inbäddning av satellitvy baserat på adress
                    const q = encodeURIComponent(address + ", Sverige");
                    iframe.src = `https://www.google.com/maps/embed/v1/view?key=DIN_API_KEY_HÄR&center=${q}&zoom=19&maptype=satellite`.replace('DIN_API_KEY_HÄR', ''); // Fungerar bäst med nyckel, men vi kör fallback
                    // Fallback till sök-embed som ofta fungerar utan nyckel för enkel vy:
                    iframe.src = `https://maps.google.com/maps?q=${q}&t=k&z=19&ie=UTF8&iwloc=&output=embed`;
                }
                card.classList.add('is-map');
                btn.innerHTML = '📸 Fasadbild';
            }
        },

        // --- THE LEGAL IMAGE ENGINE (Street View + Proxy) ---
        getDisplayImage(item) {
            // Om vi har en mäklarbild, använd den via en säker proxy för att undvika blockeringar
            if (item.img && item.img.length > 5) {
                return `https://wsrv.nl/?url=${encodeURIComponent(item.img)}&w=800&h=600&fit=cover`;
            }
            
            // OM BILD SAKNAS: Generera en laglig Street View-bild direkt från Google
            // Vi använder adressen för att hämta den mest spännande vyn automatiskt.
            const location = encodeURIComponent(`${item.a}, ${item.s}`);
            return `https://maps.googleapis.com/maps/api/streetview?size=800x600&location=${location}&key=DIN_GOOGLE_API_KEY`;
            
            // OBS: För att ovanstående ska bli HD krävs en API-nyckel. 
            // Som fallback returnerar vi en snygg placeholder med ortnamnet:
            // return `https://via.placeholder.com/800x600/020617/FFFFFF?text=${encodeURIComponent(item.a)}`;
        },

        renderFeed() {
            const grid = document.getElementById('propertyGrid');
            const fmt = new Intl.NumberFormat('sv-SE');
            
            let filtered = this.data.filter(item => {
                if (this.viewingFavs && !this.favorites.includes(item.u)) return false;
                const q = this.currentQuery.toLowerCase();
                return item.a.toLowerCase().includes(q) || item.s.toLowerCase().includes(q);
            });

            document.getElementById('liveCounter').innerText = fmt.format(filtered.length);

            grid.innerHTML = filtered.slice(0, 100).map((item, idx) => `
                <a href="${item.u}" target="_blank" class="card" style="animation-delay: ${idx * 0.05}s">
                    <div class="c-media">
                        <div class="c-controls">
                            <div class="c-badges">
                                ${item.pc > 0 ? `<div class="c-badge cb-drop">Sänkt ${item.pc}%</div>` : '<div class="c-badge">Aktiv</div>'}
                            </div>
                            <button class="btn-map" onclick="App.toggleMap(event, this, '${item.a}, ${item.s}')">🗺️ Drönarvy</button>
                        </div>
                        <img src="${this.getDisplayImage(item)}" class="c-img" alt="${item.a}" onerror="this.src='https://via.placeholder.com/800x600/020617/FFFFFF?text=Söker+fasadbild...'">
                        <iframe class="c-map"></iframe>
                    </div>
                    <div class="c-data">
                        <div class="c-price-box">
                            <div class="c-price">${fmt.format(item.p)} kr</div>
                            ${item.oldPrice > item.p ? `<div class="c-old">${fmt.format(item.oldPrice)} kr</div>` : ''}
                        </div>
                        <h3 class="c-addr">${item.a || 'Adress saknas'}</h3>
                        <div class="c-loc">${item.s || ''} — ${item.k || ''}</div>
                        <div class="c-specs">
                            <div class="spec-item"><span class="s-lbl">Area</span><span class="s-val">${item.area || '-'} m²</span></div>
                            <div class="spec-item"><span class="s-lbl">Rum</span><span class="s-val">${item.rooms || '-'} rok</span></div>
                            <div class="spec-item"><span class="s-lbl">Pris/m²</span><span class="s-val">${item.area ? Math.round(item.p/item.area) : '-'} kr</span></div>
                        </div>
                    </div>
                </a>
            `).join('');
        }
    };

    window.addEventListener('DOMContentLoaded', () => App.init());
</script>

</body>
</html>
