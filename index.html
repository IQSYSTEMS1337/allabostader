<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ALLABOSTÄDER // PRE-MARKET_v3.0</title>
    <style>
        :root { --matrix-green: #0f0; --matrix-dark: #050; --alert-red: #ff003c; }
        body { background: #000; color: var(--matrix-green); font-family: 'Courier New', monospace; margin: 0; padding: 20px; text-transform: uppercase; }
        
        .header { border-bottom: 2px solid var(--matrix-green); padding-bottom: 20px; margin-bottom: 30px; }
        
        /* GRID LAYOUT SOM DU BAD OM */
        .grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); 
            gap: 20px; 
            padding-bottom: 60px;
        }

        .card { 
            border: 1px solid var(--matrix-dark); 
            padding: 20px; 
            text-decoration: none; 
            color: inherit; 
            transition: 0.2s; 
            position: relative;
            background: rgba(0, 20, 0, 0.5);
        }
        
        .card:hover { 
            border-color: var(--matrix-green); 
            background: rgba(0, 255, 0, 0.05); 
            transform: translateY(-5px); 
            box-shadow: 0 0 15px rgba(0, 255, 0, 0.2);
        }

        .status-badge { 
            display: inline-block; 
            padding: 4px 10px; 
            font-size: 0.7rem; 
            font-weight: bold; 
            margin-bottom: 15px; 
        }
        
        .status-kommande { 
            background: var(--alert-red); 
            color: #fff; 
            box-shadow: 0 0 10px var(--alert-red); 
            animation: pulse 1.5s infinite;
        }
        
        .status-tillsalu { background: var(--matrix-green); color: #000; }

        .address { font-size: 1.1rem; font-weight: bold; color: #fff; line-height: 1.2; margin-bottom: 10px; }
        .meta { font-size: 0.75rem; color: #888; }

        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.7; }
            100% { opacity: 1; }
        }

        .status-bar { 
            position: fixed; bottom: 0; left: 0; width: 100%; 
            background: var(--matrix-green); color: #000; 
            padding: 8px; font-size: 0.8rem; font-weight: bold; text-align: center;
        }
    </style>
</head>
<body>

<div class="header">
    <h1>ALLABOSTÄDER // OMNI-SCANNER_v3.0</h1>
    <div id="stats">SCANNING SVERIGE...</div>
</div>

<div id="valvet" class="grid">SYSTEM_LOADING...</div>

<div class="status-bar" id="bar">AI_STATUS: ACTIVE | RADAR: SVERIGE_TOTAL</div>

<script>
    async function load() {
        try {
            const r = await fetch('market-data.json?v=' + Date.now());
            const data = await r.json();
            const container = document.getElementById('valvet');
            container.innerHTML = '';
            
            data.forEach(h => {
                const card = document.createElement('a');
                card.href = h.url; card.target = "_blank"; card.className = 'card';
                const isK = h.status.includes('KOMMANDE');
                
                card.innerHTML = `
                    <div class="status-badge ${isK ? 'status-kommande' : 'status-tillsalu'}">${h.status}</div>
                    <div class="address">${h.address}</div>
                    <div class="meta">KÄLLA: ${h.source} | SYNC: ${h.date}</div>
                `;
                container.appendChild(card);
            });
            document.getElementById('stats').innerText = `${data.length} OBJEKT IDENTIFIERADE`;
            document.getElementById('bar').innerText = `LAST UPDATE: ${new Date().toLocaleTimeString()} | TOTALT: ${data.length} BOSTÄDER`;
        } catch (e) {
            document.getElementById('valvet').innerText = "VÄNTAR PÅ DATA FRÅN SKRAPAN...";
        }
    }
    load();
    setInterval(load, 60000);
</script>
</body>
</html>
