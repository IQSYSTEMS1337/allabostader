<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <title>Allabostäder | Sovereign Intel V47</title>
    <style>
        :root { --gold: #c2995b; --bg: #000; --card: #080808; --green: #00ff64; --red: #ff3232; }
        body { background: var(--bg); color: #fff; font-family: 'Inter', sans-serif; margin: 0; }
        
        header { 
            padding: 60px 20px; 
            text-align: center; 
            background: radial-gradient(circle, rgba(194,153,91,0.15) 0%, #000 80%);
            border-bottom: 1px solid rgba(194,153,91,0.2);
        }
        #main-logo { height: 220px; filter: drop-shadow(0 0 30px rgba(194,153,91,0.5)); }

        .controls { background: #050505; padding: 25px; position: sticky; top: 0; z-index: 100; border-bottom: 1px solid #111; }
        #search { width: 100%; max-width: 1200px; display: block; margin: 0 auto; background: #000; border: 2px solid var(--gold); padding: 20px; border-radius: 12px; color: #fff; font-size: 1.3rem; }

        #grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(450px, 1fr)); gap: 40px; padding: 50px; }
        
        .card { background: var(--card); border-radius: 24px; border: 1px solid #1a1a1a; overflow: hidden; transition: 0.4s; cursor: pointer; position: relative; }
        .card:hover { transform: translateY(-15px); border-color: var(--gold); box-shadow: 0 30px 60px rgba(0,0,0,0.9); }
        
        .map { height: 280px; background-size: cover; background-position: center; border-bottom: 2px solid #000; }
        .body { padding: 30px; }
        
        .price { font-size: 2.6rem; color: var(--gold); font-weight: 900; font-family: 'Playfair Display', serif; }
        .address { font-size: 1.4rem; font-weight: 800; margin: 10px 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        /* Singularity Mätare */
        .metrics { margin: 20px 0; background: #000; padding: 15px; border-radius: 12px; border: 1px solid #111; }
        .metric-row { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; font-size: 0.7rem; font-weight: 900; letter-spacing: 1px; }
        .bar-bg { flex: 1; height: 6px; background: #111; border-radius: 3px; overflow: hidden; }
        .bar-fill { height: 100%; transition: width 1s; }

        .tag-cloud { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 15px; }
        .tag { font-size: 0.65rem; padding: 4px 10px; background: rgba(194,153,91,0.1); border: 1px solid var(--gold); color: var(--gold); border-radius: 4px; font-weight: 800; }

        .specs { display: flex; gap: 15px; margin-bottom: 10px; color: #666; font-size: 0.8rem; font-weight: 800; }
        .specs span { color: #fff; }
    </style>
</head>
<body>

<header><img src="logo.jpg" id="main-logo" onerror="this.src='logo.png'"></header>

<div class="controls">
    <input type="text" id="search" placeholder="Sök adress eller stad för asymmetrisk analys...">
</div>

<div id="grid"></div>

<script>
    const API_KEY = 'DIN_GOOGLE_API_NYCKEL_HÄR';

    async function init() {
        const res = await fetch('market-data.json');
        const vault = await res.json();
        const grid = document.getElementById('grid');
        const search = document.getElementById('search');

        const render = (data) => {
            grid.innerHTML = "";
            data.forEach(item => {
                const card = document.createElement('div');
                card.className = 'card';
                
                // Google Maps Satellit
                const mapUrl = `https://maps.googleapis.com/maps/api/staticmap?center=${encodeURIComponent(item.a + ',' + (item.s || ''))}&zoom=18&size=600x400&maptype=satellite&key=${API_KEY}`;

                card.innerHTML = `
                    <div class="map" style="background-image: url('${mapUrl}')"></div>
                    <div class="body">
                        <div class="price">${item.p ? item.p.toLocaleString('sv-SE') : '---'} kr</div>
                        <div class="address">${item.a}</div>
                        <div class="specs">
                            <span>${item.r || '?'} RUM</span> | <span>${item.m2 || '?'} M²</span> | <span>${item.s || 'SVERIGE'}</span>
                        </div>
                        
                        <div class="metrics">
                            <div class="metric-row">
                                <span>V-INDEX (FYND)</span>
                                <div class="bar-bg"><div class="bar-fill" style="width:${item.vI}%; background:var(--green)"></div></div>
                                <span>${item.vI}%</span>
                            </div>
                            <div class="metric-row">
                                <span>S-INDEX (SÄKERHET)</span>
                                <div class="bar-bg"><div class="bar-fill" style="width:${item.sI}%; background:var(--gold)"></div></div>
                                <span>${item.sI}%</span>
                            </div>
                            <div class="metric-row">
                                <span>L-INDEX (LYX)</span>
                                <div class="bar-bg"><div class="bar-fill" style="width:${item.lI}%; background:var(--gold-bright)"></div></div>
                                <span>${item.lI}%</span>
                            </div>
                        </div>

                        <div class="tag-cloud">
                            ${(item.tags || []).map(t => `<span class="tag">${t}</span>`).join('')}
                        </div>

                        <div style="margin-top:20px; border-top:1px solid #1a1a1a; padding-top:15px; display:flex; justify-content:space-between; align-items:center;">
                             <span style="color:#444; font-size:0.6rem;">KÄLLA: ${item.u ? new URL(item.u).hostname : 'Dold'}</span>
                             <span style="color:var(--gold); font-weight:900; font-size:0.8rem;">INFILTRERA →</span>
                        </div>
                    </div>
                `;
                card.onclick = () => window.open(item.u, '_blank');
                grid.appendChild(card);
            });
        };

        search.oninput = () => {
            const q = search.value.toLowerCase();
            render(vault.filter(v => v.a.toLowerCase().includes(q) || (v.s && v.s.toLowerCase().includes(q))));
        };

        // Sortera efter högsta V-Index som standard
        render(vault.sort((a,b) => b.vI - a.vI));
    }
    init();
</script>
</body>
</html>
