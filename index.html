<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OMNI-RECORDS // SVERIGE_TOTAL_v7.0</title>
    <style>
        :root { 
            --neon: #00ff41; 
            --dark: #000800; 
            --alert: #ff003c; 
            --gold: #ffcc00; 
            --gray: #1a1a1a;
        }
        
        * { box-sizing: border-box; font-family: 'Segoe UI', 'Courier New', monospace; cursor: crosshair; }
        body { background: var(--dark); color: var(--neon); margin: 0; overflow-x: hidden; }

        /* TERMINAL HEADER */
        .header { 
            position: sticky; top: 0; z-index: 1000;
            background: rgba(0, 10, 0, 0.95);
            border-bottom: 1px solid var(--neon);
            padding: 20px;
            backdrop-filter: blur(15px);
        }

        .top-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        h1 { margin: 0; font-size: 1.2rem; letter-spacing: 4px; text-transform: uppercase; }

        .stats-bar { display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; margin-bottom: 20px; }
        .stat-box { border-left: 2px solid var(--neon); padding-left: 10px; }
        .stat-label { font-size: 0.6rem; color: #008800; text-transform: uppercase; }
        .stat-value { font-size: 1.4rem; font-weight: bold; color: #fff; }

        /* SEARCH & FILTERS */
        .controls { display: flex; gap: 10px; flex-wrap: wrap; }
        #search { 
            flex: 1; min-width: 300px;
            background: #000; border: 1px solid var(--neon); 
            padding: 15px; color: var(--neon); font-size: 1rem;
            outline: none; box-shadow: inset 0 0 5px rgba(0, 255, 65, 0.2);
        }
        
        .f-btn { 
            background: transparent; border: 1px solid var(--neon); 
            color: var(--neon); padding: 10px 20px; cursor: pointer;
            text-transform: uppercase; font-size: 0.7rem; font-weight: bold;
            transition: 0.2s;
        }
        .f-btn:hover, .f-btn.active { background: var(--neon); color: #000; }
        .f-btn.btn-rea { border-color: var(--gold); color: var(--gold); }
        .f-btn.btn-rea.active { background: var(--gold); color: #000; }

        /* THE GRID */
        .matrix-grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); 
            gap: 1px; background: #001500; padding: 1px; 
        }

        /* CARDS */
        .card { 
            background: var(--dark); padding: 20px; 
            text-decoration: none; color: inherit; 
            transition: 0.1s; position: relative;
            display: flex; flex-direction: column; justify-content: space-between;
        }
        .card:hover { background: #001200; z-index: 2; box-shadow: inset 0 0 20px rgba(0, 255, 65, 0.1); }
        
        .tag { 
            font-size: 0.6rem; font-weight: bold; padding: 3px 8px; 
            display: inline-block; margin-bottom: 10px; border-radius: 2px;
        }
        .tag-sale { background: var(--neon); color: #000; }
        .tag-komm { background: var(--alert); color: #fff; animation: pulse 1s infinite; }
        .tag-sold { background: var(--gray); color: #888; }
        .tag-rea { background: var(--gold); color: #000; box-shadow: 0 0 10px var(--gold); }

        .address { font-size: 1rem; font-weight: bold; color: #fff; margin-bottom: 5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .price { font-size: 1.3rem; color: var(--neon); font-weight: 300; margin: 10px 0; }
        .meta { display: flex; justify-content: space-between; font-size: 0.65rem; color: #006600; border-top: 1px solid #002200; pt: 10px; margin-top: 10px; }

        .drop-pct { color: var(--gold); font-weight: bold; margin-left: 10px; }

        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.6; } 100% { opacity: 1; } }

        #loading { position: fixed; bottom: 20px; right: 20px; background: var(--neon); color: #000; padding: 10px; font-weight: bold; z-index: 2000; }
    </style>
</head>
<body>

<div id="loading">SYNCING_MATRIX...</div>

<div class="header">
    <div class="top-row">
        <h1>OMNI-DATABASE // TOTAL_SVERIGE</h1>
        <div id="clock" style="font-size: 0.8rem;"></div>
    </div>

    <div class="stats-bar">
        <div class="stat-box">
            <div class="stat-label">Totala Objekt</div>
            <div class="stat-value" id="stat-total">0</div>
        </div>
        <div class="stat-box">
            <div class="stat-label">Pre-Market (Kommande)</div>
            <div class="stat-value" id="stat-komm" style="color: var(--alert);">0</div>
        </div>
        <div class="stat-box">
            <div class="stat-label">Identifierade Klipp</div>
            <div class="stat-value" id="stat-rea" style="color: var(--gold);">0</div>
        </div>
        <div class="stat-box">
            <div class="stat-label">System Status</div>
            <div class="stat-value" style="color: var(--neon); font-size: 0.8rem;">ACTIVE_SCAN</div>
        </div>
    </div>

    <div class="controls">
        <input type="text" id="search" placeholder="QUERY: Adress, Stad, Mäklare...">
        <button class="f-btn active" onclick="setFilter('ALL', this)">ALLT</button>
        <button class="f-btn" onclick="setFilter('🔥 KOMM', this)">KOMMANDE</button>
        <button class="f-btn btn-rea" onclick="setFilter('💎 REA', this)">PRISSÄNKTA</button>
        <button class="f-btn" onclick="setFilter('💰 SÅLD', this)">SÅLDA</button>
    </div>
</div>

<div class="matrix-grid" id="grid">
    </div>

<script>
    let rawData = [];
    let currentFilter = 'ALL';
    const grid = document.getElementById('grid');

    // Klocka
    setInterval(() => {
        document.getElementById('clock').innerText = 'SYSTEM_TIME: ' + new Date().toLocaleTimeString();
    }, 1000);

    async function init() {
        try {
            const start = performance.now();
            const res = await fetch('market-data.json?v=' + Date.now());
            rawData = await res.json();
            
            // Sortera: Nyast först
            rawData.sort((a, b) => new Date(b.d) - new Date(a.d));

            updateStats();
            render();
            
            document.getElementById('loading').style.display = 'none';
            console.log(`Matrix Sync Complete in ${performance.now() - start}ms`);
        } catch (e) {
            document.getElementById('grid').innerHTML = "<h1 style='padding: 50px'>CRITICAL ERROR: DATABASE_NOT_FOUND</h1>";
        }
    }

    function updateStats() {
        document.getElementById('stat-total').innerText = rawData.length.toLocaleString();
        document.getElementById('stat-komm').innerText = rawData.filter(x => x.t.includes('KOMM')).length;
        document.getElementById('stat-rea').innerText = rawData.filter(x => x.t.includes('REA')).length;
    }

    function setFilter(type, btn) {
        currentFilter = type;
        document.querySelectorAll('.f-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        render();
    }

    function render() {
        const searchTerm = document.getElementById('search').value.toLowerCase();
        
        let filtered = rawData;
        if (currentFilter !== 'ALL') {
            filtered = filtered.filter(x => x.t.includes(currentFilter));
        }
        
        if (searchTerm) {
            filtered = filtered.filter(x => 
                x.a.toLowerCase().includes(searchTerm) || 
                x.s.toLowerCase().includes(searchTerm)
            );
        }

        // Limit rendering till 1500 objekt för prestanda (Lazy-load simulering)
        const displayData = filtered.slice(0, 1500);

        grid.innerHTML = displayData.map(h => `
            <a href="${h.u}" target="_blank" class="card">
                <div>
                    <div class="tag ${getTagClass(h.t)}">${h.t} ${h.pc ? ' -' + h.pc + '%' : ''}</div>
                    <div class="address">${h.a}</div>
                </div>
                <div>
                    <div class="price">
                        ${h.p ? (h.p / 1000000).toFixed(2) + ' <span style="font-size: 0.7rem">MSEK</span>' : 'PRIS SAKNAS'}
                        ${h.pc ? `<span class="drop-pct">📉</span>` : ''}
                    </div>
                    <div class="meta">
                        <span>SOURCE: ${h.s}</span>
                        <span>SYNC: ${h.d}</span>
                    </div>
                </div>
            </a>
        `).join('');
    }

    function getTagClass(t) {
        if(t.includes('REA')) return 'tag-rea';
        if(t.includes('KOMM')) return 'tag-komm';
        if(t.includes('SÅLD')) return 'tag-sold';
        return 'tag-sale';
    }

    document.getElementById('search').addEventListener('input', render);

    init();
</script>
</body>
</html>
