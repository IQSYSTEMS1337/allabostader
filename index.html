<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ALLABOSTÄDER // MATRIX_v2.7</title>
    <style>
        body { background: #000; color: #0f0; font-family: 'Courier New', monospace; margin: 0; padding: 20px; text-transform: uppercase; }
        .header { border-bottom: 2px solid #0f0; padding-bottom: 10px; margin-bottom: 20px; }
        .grid { display: grid; grid-template-columns: 1fr; gap: 15px; }
        .card { border: 1px solid #040; padding: 15px; transition: 0.3s; cursor: pointer; position: relative; overflow: hidden; }
        .card:hover { border-color: #0f0; background: rgba(0, 255, 0, 0.05); box-shadow: 0 0 15px rgba(0, 255, 0, 0.2); }
        .address { font-size: 1.2rem; font-weight: bold; color: #fff; }
        .meta { font-size: 0.8rem; color: #0a0; margin-top: 5px; }
        .tag { background: #0f0; color: #000; padding: 2px 5px; font-size: 0.7rem; font-weight: bold; }
        .roi { color: #0ff; font-size: 0.9rem; margin-top: 10px; border-top: 1px dashed #040; padding-top: 5px; }
        .status-bar { position: fixed; bottom: 0; left: 0; width: 100%; background: #0f0; color: #000; padding: 5px; font-size: 0.8rem; font-weight: bold; }
        a { text-decoration: none; color: inherit; }
    </style>
</head>
<body>

<div class="header">
    <h1>ALLABOSTÄDER // SYSTEM_v2.7</h1>
    <p>STATUS: <span id="ai-status">SYNCING WITH RADAR...</span></p>
</div>

<div id="valvet" class="grid">
    LADDAR MATRIX-DATA...
</div>

<div class="status-bar">
    AI_STATUS: ACTIVE | BERÄKNAD RÄNTA: 3.2% | DATA_SOURCE: HEMNET_LIVE_SYNC
</div>

<script>
    async function loadValvet() {
        try {
            // Vi lägger till ett tidsstämpel-trick för att tvinga webbläsaren att hämta nyaste filen
            const response = await fetch('market-data.json?v=' + new Date().getTime());
            const data = await response.json();
            const container = document.getElementById('valvet');
            const status = document.getElementById('ai-status');
            
            if (!data || data.length === 0 || data[0].source === "SYSTEM_IDLE") {
                container.innerHTML = "SÖKER... (HITTADE 0 JUST NU)";
                status.innerText = "RADAR SCANNING...";
                return;
            }

            container.innerHTML = '';
            status.innerText = "SYNC COMPLETE - " + data.length + " OBJEKT HITTADE";

            data.forEach(hus => {
                const card = document.createElement('a');
                card.href = hus.url;
                card.target = "_blank";
                card.className = 'card';
                
                card.innerHTML = `
                    <div class="address">${hus.address}</div>
                    <div class="meta">
                        <span class="tag">${hus.source}</span> | SYNC_TIME: ${hus.date}
                    </div>
                    <div class="roi">
                        EST. MÅNADSKOSTNAD: 14,200 SEK (EXKL. AMORT)
                    </div>
                `;
                container.appendChild(card);
            });
        } catch (e) {
            document.getElementById('valvet').innerHTML = "SYSTEM ERROR: KUNDE INTE LÄSA MARKET-DATA.JSON";
        }
    }

    loadValvet();
    // Uppdatera var 5:e minut
    setInterval(loadValvet, 300000);
</script>

</body>
</html>
