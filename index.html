<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#020203">
    <title>Allabostäder | Institutional Market Intelligence</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@200;300;400;600;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --gold: #D4AF37;
            --gold-bright: #F4CF67;
            --gold-fade: rgba(212, 175, 55, 0.1);
            --bg: #020203;
            --surface: rgba(12, 12, 18, 0.98);
            --border: rgba(212, 175, 55, 0.22);
            --text: #ffffff;
            --text-dim: #777;
            --transition: all 0.4s cubic-bezier(0.19, 1, 0.22, 1);
        }

        * { box-sizing: border-box; -webkit-font-smoothing: antialiased; margin: 0; padding: 0; }
        body { 
            background: var(--bg); color: var(--text); 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            overflow-x: hidden;
        }

        .viewport-bg {
            position: fixed; inset: 0; z-index: -1;
            background: radial-gradient(circle at 50% -10%, #1a1a2e 0%, #020203 75%);
        }

        header {
            padding: 80px 20px 40px; text-align: center;
            border-bottom: 1px solid var(--border);
            background: rgba(0,0,0,0.6); backdrop-filter: blur(20px);
        }
        .logo { max-width: 400px; width: 80%; height: auto; filter: drop-shadow(0 0 20px var(--gold-fade)); }

        .container { max-width: 1000px; margin: 0 auto; padding: 60px 20px; text-align: center; }
        .hero-h1 { font-size: clamp(2rem, 7vw, 4rem); font-weight: 800; letter-spacing: -2px; margin-bottom: 20px; line-height: 0.9; }
        .hero-h1 span { color: var(--gold); }
        .hero-p { color: var(--text-dim); font-size: 1rem; font-weight: 200; letter-spacing: 2px; margin-bottom: 50px; text-transform: uppercase; }

        /* Sökmotor - Institutional Style */
        .search-engine {
            position: relative; background: var(--surface); border: 1px solid var(--border);
            display: flex; margin: 0 auto; max-width: 800px; border-radius: 4px;
            box-shadow: 0 40px 100px -20px rgba(0,0,0,0.8);
            transition: var(--transition);
        }
        .search-engine:focus-within { border-color: var(--gold); box-shadow: 0 0 40px var(--gold-fade); }
        
        input {
            flex: 1; background: transparent; border: none; padding: 30px;
            color: #fff; font-size: 1.2rem; outline: none; font-family: inherit;
        }
        
        .btn-scan {
            background: #fff; color: #000; border: none; padding: 0 40px;
            font-weight: 800; cursor: pointer; text-transform: uppercase;
            letter-spacing: 1px; transition: 0.3s;
        }
        .btn-scan:hover { background: var(--gold); }

        /* Dropdown */
        .auto-panel {
            position: absolute; top: 100%; left: -1px; right: -1px;
            background: #0a0a0e; border: 1px solid var(--gold); z-index: 9999;
            display: none;
        }
        .auto-row {
            padding: 20px 30px; cursor: pointer; border-bottom: 1px solid #151515;
            display: flex; justify-content: space-between; text-align: left;
        }
        .auto-row:hover { background: var(--gold); color: #000; }

        /* AI Overlay / Loader */
        #ai-loader {
            display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.95);
            z-index: 10000; align-items: center; justify-content: center; flex-direction: column;
        }
        .loader-text { font-family: monospace; color: var(--gold); letter-spacing: 2px; margin-top: 20px; }
        .scanner-bar { width: 200px; height: 2px; background: #222; position: relative; overflow: hidden; }
        .scanner-bar::after { content: ''; position: absolute; top:0; left: -100%; width: 100%; height: 100%; background: var(--gold); animation: scan 1.5s infinite; }
        @keyframes scan { 100% { left: 100%; } }

        footer { padding: 60px 20px; text-align: center; opacity: 0.3; font-size: 0.6rem; letter-spacing: 3px; }
    </style>
</head>
<body>

<div class="viewport-bg"></div>

<div id="ai-loader">
    <div class="scanner-bar"></div>
    <div class="loader-text" id="loader-status">INITIALIZING DEEP SCAN...</div>
</div>

<header>
    <div class="logo-box">
        <img src="image_0.png" alt="Allabostäder" class="logo" onerror="this.src='https://via.placeholder.com/400x120/000000/D4AF37?text=ALLABOSTÄDER'">
    </div>
</header>

<div class="container">
    <div class="hero-h1">Market <span>Intelligence.</span></div>
    <div class="hero-p">Sveriges Institutionella Aggregator // v22.0</div>

    <div class="search-engine">
        <input type="text" id="engine-input" placeholder="Ange ort för analys..." autocomplete="off">
        <button class="btn-scan" onclick="startAnalysis()">Analysera</button>
        <div class="auto-panel" id="auto-panel"></div>
    </div>
</div>

<footer>
    &copy; 2026 ALLABOSTÄDER | POWERED BY APEX ENGINE
</footer>

<script>
    let store = [];
    const input = document.getElementById('engine-input');
    const panel = document.getElementById('auto-panel');
    const loader = document.getElementById('ai-loader');
    const loaderStatus = document.getElementById('loader-status');

    // Load CSV Database
    async function loadEngine() {
        try {
            const r = await fetch('Aiorter.csv');
            const t = await r.text();
            store = t.split('\n').slice(1).map(l => {
                const c = l.split(';');
                return { o: c[0]?.trim(), k: c[1]?.trim() };
            }).filter(x => x.o);
        } catch(e) { console.warn("Database Offline - Running fallback"); }
    }

    // Search Logic
    input.addEventListener('input', () => {
        const v = input.value.toLowerCase().trim();
        panel.innerHTML = '';
        if(v.length < 1) { panel.style.display = 'none'; return; }
        const hits = store.filter(x => x.o.toLowerCase().includes(v)).slice(0, 5);
        if(hits.length > 0) {
            hits.forEach(h => {
                const div = document.createElement('div');
                div.className = 'auto-row';
                div.innerHTML = `<span>${h.o}</span><small>${h.k}</small>`;
                div.onclick = () => { input.value = h.o; panel.style.display = 'none'; startAnalysis(); };
                panel.appendChild(div);
            });
            panel.style.display = 'block';
        }
    });

    // Enter Key
    input.addEventListener('keypress', (e) => { if(e.key === 'Enter') startAnalysis(); });

    // The "100 000 improvements" Function
    function startAnalysis() {
        const val = input.value.trim();
        if(!val) return;

        // Starta AI-simulering
        loader.style.display = 'flex';
        
        const sequences = [
            "CONNECTING TO REGIONAL NODES...",
            "AGGREGATING HIDDEN INVENTORY...",
            "DECRYPTING MARKET DATA...",
            "ACCESSING THE VAULT..."
        ];

        let i = 0;
        const interval = setInterval(() => {
            if(i < sequences.length) {
                loaderStatus.innerText = sequences[i];
                i++;
            } else {
                clearInterval(interval);
                // Skicka till Valvet med orten som URL-parameter
                window.location.href = `valvet.html?name=${encodeURIComponent(val)}`;
            }
        }, 600);
    }

    window.onload = loadEngine;
</script>
</body>
</html>
